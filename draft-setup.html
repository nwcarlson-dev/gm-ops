<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GM Ops Draft - Team Selection</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Teko:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    :root {
      --primary: #0a1628;
      --secondary: #1a2d4a;
      --accent: #c9243f;
      --accent-light: #e8374f;
      --gold: #d4af37;
      --silver: #8a9bae;
      --text: #f0f4f8;
      --text-muted: #8a9bae;
      --card-bg: rgba(26, 45, 74, 0.6);
      --card-border: rgba(138, 155, 174, 0.2);
      --glow: rgba(201, 36, 63, 0.3);
      --critical: #ff6b6b;
      --nfl-red: #D50A0A;
      --nfl-blue: #013369;
    }

    .app-header {
      background: var(--nfl-blue);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--nfl-red);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--silver);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .back-link:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .logo-blocks {
      display: inline-flex;
      align-items: center;
      transform: skewX(-12deg);
      font-family: 'Teko', sans-serif;
      text-decoration: none;
    }

    .logo-blocks .gm {
      font-size: 32px;
      font-weight: 700;
      color: white;
      background: var(--nfl-red);
      padding: 4px 4px 0 8px;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    .logo-blocks .ops {
      font-weight: 700;
      color: white;
      background: var(--nfl-blue);
      padding: 4px 8px 0 4px;
      line-height: 1;
      display: flex;
      align-items: baseline;
      border: 2px solid white;
      border-left: none;
    }

    .logo-blocks .ops .o {
      font-size: 32px;
      letter-spacing: 0.02em;
    }

    .logo-blocks .ops .ps {
      font-size: 26px;
      letter-spacing: 0.02em;
    }

    .logo-product {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--silver);
      margin-left: 12px;
      transform: skewX(-12deg);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-step {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--silver);
    }

    .header-step span {
      color: white;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--primary);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 100px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(201, 36, 63, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(26, 45, 74, 0.5) 0%, transparent 50%),
        linear-gradient(180deg, var(--primary) 0%, #0d1e33 100%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .shield {
      width: 44px;
      height: 52px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b1a2d 100%);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: white;
    }

    .header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff 0%, var(--silver) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--text-muted);
      font-size: 15px;
      margin-top: 8px;
      letter-spacing: 0.3px;
    }

    /* Controls */
    .controls {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .controls-label {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sort-btn {
      padding: 10px 20px;
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-muted);
      font-family: 'Source Sans 3', sans-serif;
    }

    .sort-btn:hover {
      background: rgba(255,255,255,0.08);
      border-color: var(--silver);
      color: var(--text);
    }

    .sort-btn.active {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 4px 16px var(--glow);
    }

    .select-all-btn {
      margin-left: auto;
      padding: 10px 20px;
      border: 1px solid var(--gold);
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-weight: 600;
      font-size: 14px;
      color: var(--gold);
      font-family: 'Source Sans 3', sans-serif;
    }

    .select-all-btn:hover {
      background: var(--gold);
      color: var(--primary);
    }

    /* Team Grid */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    @media (max-width: 600px) {
      .team-grid {
        grid-template-columns: 1fr;
      }
    }

    .team-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .team-card:hover {
      border-color: var(--silver);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .team-card.selected {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(201, 36, 63, 0.15) 0%, var(--card-bg) 100%);
      box-shadow: 0 4px 20px var(--glow);
    }

    .team-main {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      position: relative;
    }

    .team-color {
      width: 5px;
      height: 44px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .team-info {
      flex: 1;
      min-width: 0;
    }

    .team-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pick-number {
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(0,0,0,0.3);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .team-card.selected .pick-number {
      background: var(--accent);
      color: white;
    }

    .team-name {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .team-record {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .team-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .expand-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      color: var(--text-muted);
      font-size: 14px;
    }

    .expand-btn:hover {
      background: var(--secondary);
      border-color: var(--silver);
      color: var(--text);
    }

    .team-card.expanded .expand-btn {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--primary);
      transform: rotate(180deg);
    }

    .select-check {
      width: 26px;
      height: 26px;
      border: 2px solid var(--card-border);
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      color: transparent;
      font-size: 14px;
      font-weight: 700;
    }

    .team-card.selected .select-check {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* Team Details Panel */
    .team-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
      background: rgba(0,0,0,0.25);
    }

    .team-card.expanded .team-details {
      max-height: 400px;
    }

    .details-content {
      padding: 16px;
      border-top: 1px solid var(--card-border);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 480px) {
      .details-content {
        grid-template-columns: 1fr;
        gap: 14px;
      }
    }

    .detail-column h4 {
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--card-border);
    }

    .scheme-item {
      margin-bottom: 8px;
    }

    .scheme-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .scheme-value {
      font-size: 13px;
      color: var(--text);
      margin-top: 2px;
    }

    .need-item {
      font-size: 13px;
      color: var(--text);
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .need-item:last-child {
      border-bottom: none;
    }

    .need-item.critical::before {
      content: '●';
      color: var(--critical);
      font-size: 8px;
      margin-top: 4px;
    }

    .need-item:not(.critical)::before {
      content: '○';
      color: var(--text-muted);
      font-size: 8px;
      margin-top: 4px;
    }

    .need-content {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .need-position {
      font-weight: 600;
      color: var(--text);
    }

    .need-archetype {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
    }

    .needs-summary {
      margin-top: 12px;
      padding: 10px;
      background: rgba(0,0,0,0.2);
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
      border-left: 2px solid var(--gold);
    }

    .needs-summary strong {
      color: var(--gold);
      font-weight: 600;
    }

    .key-info {
      margin-top: 12px;
      padding: 10px;
      background: rgba(0,0,0,0.2);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text);
      line-height: 1.5;
      border-left: 2px solid var(--gold);
    }

    .key-label {
      color: var(--gold);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .play-caller {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .critical-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--card-border);
    }

    .critical-legend span {
      color: var(--critical);
    }

    /* Settings Panel */
    .settings-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
    }

    .settings-section {
      padding-right: 20px;
    }

    @media (min-width: 600px) {
      .settings-section:not(:last-child) {
        border-right: 1px solid var(--card-border);
      }
    }

    .section-title {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: var(--gold);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .rounds-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .round-btn {
      width: 42px;
      height: 42px;
      border: 2px solid var(--card-border);
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 16px;
      color: var(--text-muted);
      transition: all 0.25s ease;
    }

    .round-btn:hover {
      background: rgba(255,255,255,0.05);
      border-color: var(--silver);
      color: var(--text);
    }

    .round-btn.active {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 4px 16px var(--glow);
    }

    .slider-container {
      margin-bottom: 20px;
    }

    .slider-container:last-child {
      margin-bottom: 0;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .slider-label {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }

    .slider-value {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(201, 36, 63, 0.1);
      padding: 4px 12px;
      border-radius: 6px;
      min-width: 48px;
      text-align: center;
    }

    input[type=range] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--secondary);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      cursor: pointer;
      border: 3px solid var(--primary);
      box-shadow: 0 2px 8px var(--glow);
    }

    input[type=range]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      cursor: pointer;
      border: 3px solid var(--primary);
    }

    /* Toggle Switch */
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--card-border);
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--secondary);
      border-radius: 26px;
      transition: 0.3s;
    }

    .toggle-slider::before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background: var(--text-muted);
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: var(--accent);
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(22px);
      background: white;
    }

    .toggle-label {
      font-size: 14px;
      color: var(--text);
    }

    /* Footer */
    .action-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, transparent 0%, var(--primary) 30%);
      padding: 20px;
      z-index: 1000;
    }

    .footer-content {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .selection-count {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
    }

    .selection-count span {
      color: var(--gold);
      font-weight: 700;
    }

    .start-btn {
      width: 100%;
      padding: 16px 32px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b1a2d 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 3px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 24px var(--glow);
      position: relative;
      overflow: hidden;
    }

    .start-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px var(--glow);
    }

    .start-btn:hover::before {
      left: 100%;
    }

    .start-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .controls {
        justify-content: center;
      }
      .select-all-btn {
        margin-left: 0;
        width: 100%;
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <a href="index.html" class="back-link">← Menu</a>
      <a href="index.html" class="logo-blocks">
        <span class="gm">GM</span>
        <span class="ops"><span class="o">O</span><span class="ps">PS</span></span>
      </a>
      <span class="logo-product">Draft</span>
    </div>
    <div class="header-right">
      <span class="header-step">Step <span>1</span> of 3</span>
    </div>
  </header>

  <div class="container">
    <header class="header">
      <h1>Select Your Team</h1>
      <p>Choose which team you'll control in the draft</p>
    </header>

    <div class="controls">
      <span class="controls-label">Sort:</span>
      <button class="sort-btn active" id="sortOrder" onclick="setSort('order')">Draft Order</button>
      <button class="sort-btn" id="sortAlpha" onclick="setSort('alpha')">A-Z</button>
    </div>

    <div id="teamGrid" class="team-grid"></div>

    <div class="settings-panel">
      <div class="settings-grid">
        <div class="settings-section">
          <div class="section-title">Number of Rounds</div>
          <div class="rounds-options">
            <button class="round-btn" onclick="setRounds(1)">1</button>
            <button class="round-btn" onclick="setRounds(2)">2</button>
            <button class="round-btn" onclick="setRounds(3)">3</button>
            <button class="round-btn" onclick="setRounds(4)">4</button>
            <button class="round-btn" onclick="setRounds(5)">5</button>
            <button class="round-btn" onclick="setRounds(6)">6</button>
            <button class="round-btn active" onclick="setRounds(7)">7</button>
          </div>
          <div class="toggle-container">
            <label class="toggle-switch">
              <input type="checkbox" id="cpuTradesToggle" checked>

      if (selected) {
        const teamName = selected.querySelector('.team-name').innerText;
        countEl.innerHTML = `<span>${teamName}</span> selected`;
      } else {
        countEl.textContent = 'No team selected';
      }
      document.getElementById('startBtn').disabled = !selected;
    }

    function toggleExpand(teamName, e) {
      e.stopPropagation();
      const card = document.getElementById(`card-${teamName}`);
      
      if (expandedTeam && expandedTeam !== teamName) {
        document.getElementById(`card-${expandedTeam}`).classList.remove('expanded');
      }
      
      card.classList.toggle('expanded');
      expandedTeam = card.classList.contains('expanded') ? teamName : null;
    }

    function toggleSelect(card, e) {
      if (e.target.closest('.expand-btn')) return;
      
      const wasSelected = card.classList.contains('selected');
      document.querySelectorAll('.team-card.selected').forEach(c => c.classList.remove('selected'));
      if (!wasSelected) {
        card.classList.add('selected');
      }
      updateSelectionCount();
    }

    function renderTeams() {
      const grid = document.getElementById('teamGrid');
      grid.innerHTML = '';

      const sorted = [...teams].sort((a, b) =>
        currentSort === 'alpha' ? a.n.localeCompare(b.n) : a.p - b.p
      );

      sorted.forEach(t => {
        const card = document.createElement('div');
        card.className = 'team-card';
        card.id = `card-${t.n}`;
        
        card.innerHTML = `
          <div class="team-main">
            <div class="team-color" style="background: linear-gradient(180deg, ${t.c} 0%, ${adjustColor(t.c, -30)} 100%)"></div>
            <div class="team-info">
              <div class="team-name-row">
                <span class="pick-number">#${t.p}</span>
                <span class="team-name">${t.n}</span>
              </div>
              <div class="team-record">${t.rec}</div>
            </div>
            <div class="team-actions">
              <button class="expand-btn" onclick="toggleExpand('${t.n}', event)" title="View Details">▼</button>
              <div class="select-check">✓</div>
            </div>
          </div>
          <div class="team-details">
            <div class="details-content">
              <div class="detail-column">
                <h4>Overview</h4>
                <div class="scheme-item">
                  <div class="scheme-label">Offensive Scheme</div>
                  <div class="scheme-value">${t.offScheme}</div>
                  <div class="play-caller">${t.oc || ''}</div>
                </div>
                <div class="scheme-item">
                  <div class="scheme-label">Defensive Scheme</div>
                  <div class="scheme-value">${t.defScheme}</div>
                  <div class="play-caller">${t.dc || ''}</div>
                </div>
                ${t.summary ? `<div class="key-info"><div class="key-label">Key</div>${t.summary}</div>` : ''}
              </div>
              <div class="detail-column">
                <h4>Offensive Needs</h4>
                ${t.offNeeds.map(n => `<div class="need-item ${n[0] ? 'critical' : ''}"><div class="need-content"><div class="need-position">${n[1]}</div><div class="need-archetype">${n[2]}</div></div></div>`).join('')}
              </div>
              <div class="detail-column">
                <h4>Defensive Needs</h4>
                ${t.defNeeds.map(n => `<div class="need-item ${n[0] ? 'critical' : ''}"><div class="need-content"><div class="need-position">${n[1]}</div><div class="need-archetype">${n[2]}</div></div></div>`).join('')}
                <div class="critical-legend"><span>●</span> Critical Need</div>
              </div>
            </div>
          </div>
        `;

        card.addEventListener('click', (e) => toggleSelect(card, e));
        grid.appendChild(card);
      });

      updateSelectionCount();
    }

    function adjustColor(hex, percent) {
      const num = parseInt(hex.replace('#', ''), 16);
      const amt = Math.round(2.55 * percent);
      const R = Math.min(255, Math.max(0, (num >> 16) + amt));
      const G = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
      const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
      return `#${(0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1)}`;
    }

    function submitDraft() {
      const selectedCard = document.querySelector('.team-card.selected');

      if (!selectedCard) {
        alert("Please select a team!");
        return;
      }

      const teamName = selectedCard.querySelector('.team-name').innerText;
      const teamObj = teams.find(t => t.n === teamName);

      const settings = {
        selectedTeams: [teamName],
        teamData: teamObj ? {
          name: teamObj.n,
          pick: teamObj.p,
          record: teamObj.rec,
          oc: teamObj.oc,
          dc: teamObj.dc,
          offScheme: teamObj.offScheme,
          defScheme: teamObj.defScheme,
          offNeeds: teamObj.offNeeds,
          defNeeds: teamObj.defNeeds,
          summary: teamObj.summary
        } : null,
        posVal: document.getElementById('posVal').innerText,
        needVal: document.getElementById('needVal').innerText,
        rounds: selectedRounds,
        prospects: prospects
      };

      localStorage.setItem('gmops_draft_settings', JSON.stringify(settings));
      window.location.href = 'game-shell.html';
    }

    window.onload = renderTeams;
  </script>
</body>
</html>
