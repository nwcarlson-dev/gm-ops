<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Feedback</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            font-size: 14px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }
        
        .header h1 {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
        }
        
        .type-toggle {
            display: flex;
            gap: 4px;
        }
        
        .type-btn {
            padding: 4px 10px;
            border: 1px solid #444;
            background: transparent;
            color: #888;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .type-btn.active {
            background: #2a5a2a;
            color: #fff;
            border-color: #3a7a3a;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .recorder {
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
        }
        
        .topic-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .topic-number {
            font-size: 20px;
            font-weight: 600;
            color: #6a6;
        }
        
        .date { font-size: 12px; color: #666; }
        
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .record-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #c44;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .record-btn .inner {
            width: 20px;
            height: 20px;
            background: #c44;
            border-radius: 50%;
            transition: all 0.15s;
        }
        
        .record-btn.recording .inner {
            border-radius: 3px;
            width: 16px;
            height: 16px;
        }
        
        .status {
            font-size: 13px;
            color: #888;
        }
        
        .status.recording { color: #c44; }
        .status.error { color: #c44; }
        .status.success { color: #6a6; }
        
        .transcript {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            min-height: 80px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 12px;
        }
        
        .transcript.placeholder { color: #555; }
        
        .save-btn {
            width: 100%;
            padding: 10px;
            background: #2a4a6a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        
        .save-btn:hover { background: #3a5a7a; }
        .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .tech-alert {
            background: rgba(200, 150, 50, 0.15);
            border: 1px solid #a85;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 12px;
            display: none;
            font-size: 12px;
        }
        
        .tech-alert.show { display: block; }
        
        .tech-alert p { margin: 0 0 8px 0; color: #ca8; }
        
        .tech-alert-btns { display: flex; gap: 8px; }
        
        .tech-alert-btns button {
            padding: 4px 10px;
            border-radius: 4px;
            border: none;
            font-size: 11px;
            cursor: pointer;
        }
        
        .switch-btn { background: #a85; color: #000; }
        .keep-btn { background: #444; color: #ccc; }
        
        .feeds-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        
        .feed {
            flex: 1;
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .feed h3 {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            margin: 0 0 8px 0;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .feed h3 .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        
        .feed.game h3 .dot { background: #6a6; }
        .feed.technical h3 .dot { background: #68a; }
        
        .feed-item {
            border-bottom: 1px solid #333;
            font-size: 12px;
        }
        
        .feed-item:last-child { border-bottom: none; }
        
        .feed-item summary {
            padding: 6px 0;
            cursor: pointer;
            color: #aaa;
            list-style: none;
        }
        
        .feed-item summary::-webkit-details-marker { display: none; }
        
        .feed-item summary::before {
            content: '▸';
            display: inline-block;
            margin-right: 6px;
            font-size: 10px;
            color: #555;
            transition: transform 0.15s;
        }
        
        .feed-item[open] summary::before {
            transform: rotate(90deg);
        }
        
        .feed-item .content {
            padding: 8px 0 8px 16px;
            color: #888;
            font-size: 11px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        
        .move-btn {
            margin-top: 8px;
            padding: 3px 8px;
            background: #3a3a3a;
            color: #999;
            border: 1px solid #555;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
        }
        
        .move-btn:hover { background: #4a4a4a; color: #ccc; }
        
        @media (max-width: 500px) {
            .feeds-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dev Feedback</h1>
        <div class="type-toggle">
            <button class="type-btn active" data-type="game">Game</button>
            <button class="type-btn" data-type="technical">Technical</button>
        </div>
    </div>
    
    <div class="container">
        <div class="recorder">
            <div class="topic-row">
                <span class="topic-number" id="topicNumber">1.1</span>
                <span class="date" id="dateDisplay"></span>
            </div>
            
            <div class="controls">
                <button class="record-btn" id="recordBtn">
                    <span class="inner"></span>
                </button>
                <span class="status" id="status">Click to record</span>
                <a id="downloadLink" style="display:none; margin-left: auto; font-size: 11px; color: #68a; text-decoration: underline; cursor: pointer;">Download Audio</a>
                <button id="retryBtn" style="display:none; margin-left: 8px; padding: 4px 10px; background: #444; color: #ccc; border: none; border-radius: 4px; font-size: 11px; cursor: pointer;">Retry</button>
                <input type="file" id="audioUpload" accept="audio/*,.webm,audio/webm" style="display:none;">
                <button id="uploadBtn" style="margin-left: 8px; padding: 4px 10px; background: #4a6a8a; color: #fff; border: none; border-radius: 4px; font-size: 11px; cursor: pointer;">Upload Audio</button>
            </div>
            
            <div class="transcript placeholder" id="transcript">Transcript will appear here...</div>
            
            <div class="tech-alert" id="techAlert">
                <p>Sounds like a technical topic. Switch folder?</p>
                <div class="tech-alert-btns">
                    <button class="switch-btn" id="switchBtn">Switch</button>
                    <button class="keep-btn" id="keepBtn">Keep</button>
                </div>
            </div>
            
            <button class="save-btn" id="saveBtn" disabled>Save Topic</button>
        </div>
        
    </div>
    
    <div class="feeds-row">
        <div class="feed game">
            <h3><span class="dot"></span>Game Dev</h3>
            <div id="gameFeed">Loading...</div>
        </div>
        <div class="feed technical">
            <h3><span class="dot"></span>Technical</h3>
            <div id="techFeed">Loading...</div>
        </div>
    </div>

    <script>
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let currentType = 'game';
        let dayNumber = 1;
        let topicCount = 0;
        let lastAudioBlob = null;
        
        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        const transcript = document.getElementById('transcript');
        const saveBtn = document.getElementById('saveBtn');
        const topicNumber = document.getElementById('topicNumber');
        const dateDisplay = document.getElementById('dateDisplay');
        const gameFeed = document.getElementById('gameFeed');
        const techFeed = document.getElementById('techFeed');
        const techAlert = document.getElementById('techAlert');
        const downloadLink = document.getElementById('downloadLink');
        const retryBtn = document.getElementById('retryBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const audioUpload = document.getElementById('audioUpload');
        
        uploadBtn.addEventListener('click', () => audioUpload.click());
        
        audioUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            log('Processing uploaded file...');
            lastAudioBlob = file;
            downloadLink.href = URL.createObjectURL(file);
            downloadLink.download = `topic-${topicNumber.textContent}.${file.name.split('.').pop()}`;
            downloadLink.style.display = 'inline';
            
            await transcribeAudio(file);
            audioUpload.value = '';
        });
        
        function log(msg, type = '') {
            status.textContent = msg;
            status.className = 'status ' + type;
            console.log('[DevFeedback]', msg);
        }
        
        async function fetchWithRetry(url, options, maxRetries = 3) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    const res = await fetch(url, options);
                    const text = await res.text();
                    try {
                        return { ok: res.ok, status: res.status, data: JSON.parse(text) };
                    } catch (e) {
                        if (text.includes('deploy') || text.includes('building')) {
                            console.log(`[DevFeedback] Deployment in progress, retry ${attempt}/${maxRetries}...`);
                            if (attempt < maxRetries) {
                                log(`Deployment in progress, retrying (${attempt}/${maxRetries})...`);
                                await new Promise(r => setTimeout(r, 3000));
                                continue;
                            }
                        }
                        throw new Error('Invalid response: ' + text.slice(0, 100));
                    }
                } catch (e) {
                    if (attempt === maxRetries) throw e;
                    log(`Network error, retrying (${attempt}/${maxRetries})...`);
                    await new Promise(r => setTimeout(r, 2000));
                }
            }
        }
        
        async function transcribeAudio(blob) {
            log('Transcribing...');
            
            const formData = new FormData();
            formData.append('audio', blob);
            
            try {
                const { ok, status, data } = await fetchWithRetry('/api/transcribe', {
                    method: 'POST',
                    body: formData
                });
                
                console.log('[DevFeedback] Response status:', status);
                console.log('[DevFeedback] Response:', data);
                
                if (data.error) {
                    log('Error - click Retry', 'error');
                    transcript.textContent = 'Error: ' + (data.details || data.error);
                    transcript.classList.remove('placeholder');
                    retryBtn.style.display = 'inline';
                } else if (data.text) {
                    transcript.textContent = data.text;
                    transcript.classList.remove('placeholder');
                    saveBtn.disabled = false;
                    retryBtn.style.display = 'none';
                    log('Ready to save', 'success');
                    
                    if (currentType === 'game' && data.technicalDetected) {
                        techAlert.classList.add('show');
                    }
                } else {
                    log('No text - click Retry', 'error');
                    transcript.textContent = 'No transcription returned';
                    transcript.classList.remove('placeholder');
                    retryBtn.style.display = 'inline';
                }
            } catch (e) {
                console.error('[DevFeedback] Fetch error:', e);
                log('Failed - click Retry', 'error');
                transcript.textContent = 'Network error: ' + e.message;
                transcript.classList.remove('placeholder');
                retryBtn.style.display = 'inline';
            }
        }
        
        retryBtn.addEventListener('click', async () => {
            if (lastAudioBlob) {
                await transcribeAudio(lastAudioBlob);
            }
        });
        
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
                updateTopicNumber();
            });
        });
        
        document.getElementById('switchBtn').addEventListener('click', () => {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-type="technical"]').classList.add('active');
            currentType = 'technical';
            techAlert.classList.remove('show');
            updateTopicNumber();
        });
        
        document.getElementById('keepBtn').addEventListener('click', () => {
            techAlert.classList.remove('show');
        });
        
        function updateTopicNumber() {
            const prefix = currentType === 'technical' ? 'T' : '';
            topicNumber.textContent = prefix + dayNumber + '.' + (topicCount + 1);
        }
        
        function updateDate() {
            const now = new Date();
            dateDisplay.textContent = now.toLocaleDateString('en-US', { 
                month: 'short', day: 'numeric', year: 'numeric' 
            });
        }
        
        async function loadFeed(type, container) {
            try {
                const res = await fetch('/api/topics?type=' + type + '&full=1');
                const data = await res.json();
                
                if (data.topics.length === 0) {
                    container.innerHTML = '<div class="feed-item"><summary>No topics yet</summary></div>';
                    return 0;
                } else {
                    const targetType = type === 'game' ? 'technical' : 'game';
                    const targetLabel = type === 'game' ? 'Move to Technical' : 'Move to Game';
                    container.innerHTML = data.topics.map(t => 
                        '<details class="feed-item"><summary>' + t.title + '</summary><div class="content">' + (t.content || '') + '<button class="move-btn" data-topic="' + t.title + '" data-from="' + type + '" data-to="' + targetType + '">' + targetLabel + '</button></div></details>'
                    ).join('');
                    
                    // Add move handlers
                    container.querySelectorAll('.move-btn').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            const topic = btn.dataset.topic;
                            const from = btn.dataset.from;
                            const to = btn.dataset.to;
                            btn.textContent = 'Moving...';
                            btn.disabled = true;
                            
                            try {
                                const res = await fetch('/api/move-topic', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ topic, fromType: from, toType: to })
                                });
                                const data = await res.json();
                                if (data.success) {
                                    loadAllFeeds();
                                } else {
                                    btn.textContent = 'Failed';
                                    setTimeout(() => { btn.textContent = targetLabel; btn.disabled = false; }, 2000);
                                }
                            } catch (e) {
                                btn.textContent = 'Error';
                                setTimeout(() => { btn.textContent = targetLabel; btn.disabled = false; }, 2000);
                            }
                        });
                    });
                    
                    return data.topics.length;
                }
            } catch (e) {
                container.innerHTML = '<div class="feed-item"><summary>Failed to load</summary></div>';
                return 0;
            }
        }
        
        async function loadAllFeeds() {
            const gameCount = await loadFeed('game', gameFeed);
            await loadFeed('technical', techFeed);
            topicCount = currentType === 'game' ? gameCount : 0;
            updateTopicNumber();
        }
        
        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    log('Requesting mic...');
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => {
                        audioChunks.push(e.data);
                    };
                    
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        lastAudioBlob = blob;
                        console.log('[DevFeedback] Audio blob size:', blob.size);
                        
                        // Create download link for backup
                        const url = URL.createObjectURL(blob);
                        downloadLink.href = url;
                        downloadLink.download = 'recording-' + Date.now() + '.webm';
                        downloadLink.style.display = 'inline';
                        retryBtn.style.display = 'none';
                        
                        await transcribeAudio(blob);
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    log('Recording...', 'recording');
                } catch (e) {
                    log('Mic denied: ' + e.message, 'error');
                }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                recordBtn.classList.remove('recording');
            }
        });
        
        saveBtn.addEventListener('click', async () => {
            const text = transcript.textContent;
            if (!text || transcript.classList.contains('placeholder')) {
                log('Nothing to save', 'error');
                return;
            }
            
            saveBtn.textContent = 'Generating title...';
            saveBtn.disabled = true;
            
            let topicTitle = '[Untitled]';
            try {
                log('Generating title...');
                const titleRes = await fetch('/api/generate-title', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const titleData = await titleRes.json();
                if (titleData.title && titleData.title !== 'Untitled Topic') {
                    topicTitle = titleData.title;
                }
            } catch (e) {
                console.error('Title generation failed, saving with placeholder:', e);
            }
            
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const prefix = currentType === 'technical' ? 'dev-technical' : 'dev-planning';
            const filename = prefix + '_' + dateStr + '_0001.md';
            const topicNum = (currentType === 'technical' ? 'T' : '') + dayNumber + '.' + (topicCount + 1);
            
            const content = '## ' + topicNum + ' - ' + topicTitle + '\n*' + dateStr + '*\n\n' + text;
            
            saveBtn.textContent = 'Saving...';
            saveBtn.disabled = true;
            log('Saving to GitHub...');
            
            try {
                const res = await fetch('/api/save-transcript', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, content, type: currentType })
                });
                
                const data = await res.json();
                console.log('[DevFeedback] Save response:', data);
                
                if (res.ok && data.success) {
                    log('Saved!', 'success');
                    transcript.textContent = 'Transcript will appear here...';
                    transcript.classList.add('placeholder');
                    techAlert.classList.remove('show');
                    
                    // If saved with placeholder title, trigger background fix
                    if (topicTitle === '[Untitled]') {
                        setTimeout(async () => {
                            try {
                                await fetch('/api/fix-untitled');
                                loadAllFeeds();
                            } catch (e) {}
                        }, 2000);
                    }
                    
                    loadAllFeeds();
                    saveBtn.textContent = 'Save Topic';
                } else {
                    log('Save failed: ' + (data.error || 'Unknown'), 'error');
                    saveBtn.textContent = 'Save Topic';
                    saveBtn.disabled = false;
                }
            } catch (e) {
                console.error('[DevFeedback] Save error:', e);
                log('Save failed: ' + e.message, 'error');
                saveBtn.textContent = 'Save Topic';
                saveBtn.disabled = false;
            }
        });
        
        updateDate();
        loadAllFeeds();
        setInterval(loadAllFeeds, 5000);
    </script>
</body>
</html>
