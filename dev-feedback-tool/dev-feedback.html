<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Feedback</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            font-size: 14px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }
        
        .header h1 {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
        }
        
        .type-toggle {
            display: flex;
            gap: 4px;
        }
        
        .type-btn {
            padding: 4px 10px;
            border: 1px solid #444;
            background: transparent;
            color: #888;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .type-btn.active {
            background: #2a5a2a;
            color: #fff;
            border-color: #3a7a3a;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .recorder {
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
        }
        
        .topic-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .topic-number {
            font-size: 20px;
            font-weight: 600;
            color: #6a6;
        }
        
        .date { font-size: 12px; color: #666; }
        
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .record-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #c44;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .record-btn .inner {
            width: 20px;
            height: 20px;
            background: #c44;
            border-radius: 50%;
            transition: all 0.15s;
        }
        
        .record-btn.recording .inner {
            border-radius: 3px;
            width: 16px;
            height: 16px;
        }
        
        .status {
            font-size: 13px;
            color: #888;
        }
        
        .status.recording { color: #c44; }
        .status.error { color: #c44; }
        .status.success { color: #6a6; }
        
        .transcript {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            min-height: 80px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 12px;
        }
        
        .transcript.placeholder { color: #555; }
        
        .save-btn {
            width: 100%;
            padding: 10px;
            background: #2a4a6a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        
        .save-btn:hover { background: #3a5a7a; }
        .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .tech-alert {
            background: rgba(200, 150, 50, 0.15);
            border: 1px solid #a85;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 12px;
            display: none;
            font-size: 12px;
        }
        
        .tech-alert.show { display: block; }
        
        .tech-alert p { margin: 0 0 8px 0; color: #ca8; }
        
        .tech-alert-btns { display: flex; gap: 8px; }
        
        .tech-alert-btns button {
            padding: 4px 10px;
            border-radius: 4px;
            border: none;
            font-size: 11px;
            cursor: pointer;
        }
        
        .switch-btn { background: #a85; color: #000; }
        .keep-btn { background: #444; color: #ccc; }
        
        .feed {
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
        }
        
        .feed h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            margin: 0 0 8px 0;
            font-weight: 500;
        }
        
        .feed-item {
            padding: 6px 0;
            border-bottom: 1px solid #333;
            font-size: 12px;
            color: #aaa;
        }
        
        .feed-item:last-child { border-bottom: none; }
        
        @media (min-width: 600px) {
            .container {
                flex-direction: row;
            }
            .recorder { flex: 1; }
            .feed { width: 280px; max-height: 400px; overflow-y: auto; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dev Feedback</h1>
        <div class="type-toggle">
            <button class="type-btn active" data-type="game">Game</button>
            <button class="type-btn" data-type="technical">Technical</button>
        </div>
    </div>
    
    <div class="container">
        <div class="recorder">
            <div class="topic-row">
                <span class="topic-number" id="topicNumber">1.1</span>
                <span class="date" id="dateDisplay"></span>
            </div>
            
            <div class="controls">
                <button class="record-btn" id="recordBtn">
                    <span class="inner"></span>
                </button>
                <span class="status" id="status">Click to record</span>
            </div>
            
            <div class="transcript placeholder" id="transcript">Transcript will appear here...</div>
            
            <div class="tech-alert" id="techAlert">
                <p>Sounds like a technical topic. Switch folder?</p>
                <div class="tech-alert-btns">
                    <button class="switch-btn" id="switchBtn">Switch</button>
                    <button class="keep-btn" id="keepBtn">Keep</button>
                </div>
            </div>
            
            <button class="save-btn" id="saveBtn" disabled>Save Topic</button>
        </div>
        
        <div class="feed">
            <h3>Recent Topics</h3>
            <div id="topicsFeed">Loading...</div>
        </div>
    </div>

    <script>
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let currentType = 'game';
        let dayNumber = 1;
        let topicCount = 0;
        
        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        const transcript = document.getElementById('transcript');
        const saveBtn = document.getElementById('saveBtn');
        const topicNumber = document.getElementById('topicNumber');
        const dateDisplay = document.getElementById('dateDisplay');
        const topicsFeed = document.getElementById('topicsFeed');
        const techAlert = document.getElementById('techAlert');
        
        function log(msg, type = '') {
            status.textContent = msg;
            status.className = 'status ' + type;
            console.log('[DevFeedback]', msg);
        }
        
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
                loadTopics();
                updateTopicNumber();
            });
        });
        
        document.getElementById('switchBtn').addEventListener('click', () => {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-type="technical"]').classList.add('active');
            currentType = 'technical';
            techAlert.classList.remove('show');
            updateTopicNumber();
        });
        
        document.getElementById('keepBtn').addEventListener('click', () => {
            techAlert.classList.remove('show');
        });
        
        function updateTopicNumber() {
            const prefix = currentType === 'technical' ? 'T' : '';
            topicNumber.textContent = prefix + dayNumber + '.' + (topicCount + 1);
        }
        
        function updateDate() {
            const now = new Date();
            dateDisplay.textContent = now.toLocaleDateString('en-US', { 
                month: 'short', day: 'numeric', year: 'numeric' 
            });
        }
        
        async function loadTopics() {
            try {
                const res = await fetch('/api/topics?type=' + currentType);
                const data = await res.json();
                
                if (data.topics.length === 0) {
                    topicsFeed.innerHTML = '<div class="feed-item">No topics yet</div>';
                    topicCount = 0;
                } else {
                    topicsFeed.innerHTML = data.topics.map(t => 
                        '<div class="feed-item">' + t + '</div>'
                    ).join('');
                    topicCount = data.topics.length;
                }
                updateTopicNumber();
            } catch (e) {
                topicsFeed.innerHTML = '<div class="feed-item">Failed to load</div>';
            }
        }
        
        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    log('Requesting mic...');
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => {
                        audioChunks.push(e.data);
                    };
                    
                    mediaRecorder.onstop = async () => {
                        log('Transcribing...');
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        console.log('[DevFeedback] Audio blob size:', blob.size);
                        
                        const formData = new FormData();
                        formData.append('audio', blob);
                        
                        try {
                            const res = await fetch('/api/transcribe', {
                                method: 'POST',
                                body: formData
                            });
                            
                            console.log('[DevFeedback] Response status:', res.status);
                            const data = await res.json();
                            console.log('[DevFeedback] Response:', data);
                            
                            if (data.error) {
                                log('Error: ' + data.error, 'error');
                                transcript.textContent = 'Error: ' + (data.details || data.error);
                                transcript.classList.remove('placeholder');
                            } else if (data.text) {
                                transcript.textContent = data.text;
                                transcript.classList.remove('placeholder');
                                saveBtn.disabled = false;
                                log('Ready to save', 'success');
                                
                                if (currentType === 'game' && data.technicalDetected) {
                                    techAlert.classList.add('show');
                                }
                            } else {
                                log('No text returned', 'error');
                                transcript.textContent = 'No transcription returned';
                                transcript.classList.remove('placeholder');
                            }
                        } catch (e) {
                            console.error('[DevFeedback] Fetch error:', e);
                            log('Request failed: ' + e.message, 'error');
                            transcript.textContent = 'Network error: ' + e.message;
                            transcript.classList.remove('placeholder');
                        }
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    log('Recording...', 'recording');
                } catch (e) {
                    log('Mic denied: ' + e.message, 'error');
                }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                recordBtn.classList.remove('recording');
            }
        });
        
        saveBtn.addEventListener('click', async () => {
            const text = transcript.textContent;
            if (!text || transcript.classList.contains('placeholder')) {
                log('Nothing to save', 'error');
                return;
            }
            
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const prefix = currentType === 'technical' ? 'dev-technical' : 'dev-planning';
            const filename = prefix + '_' + dateStr + '_0001.md';
            const topicNum = (currentType === 'technical' ? 'T' : '') + dayNumber + '.' + (topicCount + 1);
            
            const content = '## ' + topicNum + ' - [Topic Title]\n*' + dateStr + '*\n\n' + text;
            
            saveBtn.textContent = 'Saving...';
            saveBtn.disabled = true;
            log('Saving to GitHub...');
            
            try {
                const res = await fetch('/api/save-transcript', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, content, type: currentType })
                });
                
                const data = await res.json();
                console.log('[DevFeedback] Save response:', data);
                
                if (res.ok && data.success) {
                    log('Saved!', 'success');
                    transcript.textContent = 'Transcript will appear here...';
                    transcript.classList.add('placeholder');
                    techAlert.classList.remove('show');
                    loadTopics();
                    saveBtn.textContent = 'Save Topic';
                } else {
                    log('Save failed: ' + (data.error || 'Unknown'), 'error');
                    saveBtn.textContent = 'Save Topic';
                    saveBtn.disabled = false;
                }
            } catch (e) {
                console.error('[DevFeedback] Save error:', e);
                log('Save failed: ' + e.message, 'error');
                saveBtn.textContent = 'Save Topic';
                saveBtn.disabled = false;
            }
        });
        
        updateDate();
        loadTopics();
        setInterval(loadTopics, 5000);
    </script>
</body>
</html>
