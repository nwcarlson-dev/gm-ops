<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Feedback - GM Ops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --card-bg: #1a1a2e;
            --card-border: #2a2a4a;
            --white: #fff;
            --gold: #d4af37;
            --silver: #a5acaf;
            --text-muted: #6b7280;
            --nfl-red: #d50a0a;
            --nfl-blue: #013369;
            --warning: #f59e0b;
        }
        
        body {
            background: var(--bg-dark);
            color: var(--white);
            min-height: 100vh;
            padding: 40px;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 24px;
        }
        
        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 48px;
            color: var(--white);
            margin: 0 0 8px 0;
        }
        
        .subtitle { color: var(--text-muted); margin-bottom: 32px; }
        
        .recorder-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .type-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .type-btn {
            padding: 8px 16px;
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--silver);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        
        .type-btn.active {
            background: var(--gold);
            color: var(--bg-dark);
            border-color: var(--gold);
        }
        
        .type-btn:hover:not(.active) {
            border-color: var(--silver);
        }
        
        .recorder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .recorder-header h2 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--gold);
            margin: 0;
        }
        
        .topic-info {
            display: flex;
            gap: 24px;
            margin-bottom: 16px;
            align-items: center;
        }
        
        .topic-number {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: var(--gold);
        }
        
        .date-display { font-size: 14px; color: var(--silver); }
        
        .recorder-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .record-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 3px solid var(--nfl-red);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .record-btn:hover { background: rgba(213, 10, 10, 0.2); }
        
        .record-btn .inner {
            width: 28px;
            height: 28px;
            background: var(--nfl-red);
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .record-btn.recording .inner {
            border-radius: 4px;
            width: 24px;
            height: 24px;
        }
        
        .status { font-size: 14px; color: var(--text-muted); }
        .status.recording { color: var(--nfl-red); }
        
        .transcript-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            min-height: 100px;
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .save-btn {
            width: 100%;
            padding: 12px;
            background: var(--nfl-blue);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 16px;
        }
        
        .save-btn:hover { background: #014a99; }
        .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .feed-column { position: sticky; top: 40px; height: fit-content; }
        
        .feed-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .feed-card h3 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            color: var(--silver);
            margin: 0 0 12px 0;
        }
        
        .feed-item {
            padding: 8px 0;
            border-bottom: 1px solid var(--card-border);
            font-size: 13px;
        }
        
        .feed-item:last-child { border-bottom: none; }
        
        .tech-alert {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--warning);
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            display: none;
        }
        
        .tech-alert.show { display: block; }
        
        .tech-alert p { margin: 0 0 8px 0; font-size: 13px; color: var(--warning); }
        
        .tech-alert-btns { display: flex; gap: 8px; }
        
        .tech-alert-btns button {
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            font-size: 12px;
            cursor: pointer;
        }
        
        .switch-btn { background: var(--warning); color: #000; }
        .keep-btn { background: var(--card-border); color: var(--white); }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-column">
            <h1>Dev Feedback</h1>
            <p class="subtitle">Record planning dialogue for GM Ops development</p>
            
            <div class="recorder-card">
                <div class="type-toggle">
                    <button class="type-btn active" data-type="game">Game Dev</button>
                    <button class="type-btn" data-type="technical">Technical</button>
                </div>
                
                <div class="recorder-header">
                    <h2>New Topic</h2>
                </div>
                
                <div class="topic-info">
                    <span class="topic-number" id="topicNumber">1.1</span>
                    <span class="date-display" id="dateDisplay"></span>
                </div>
                
                <div class="recorder-controls">
                    <button class="record-btn" id="recordBtn">
                        <span class="inner"></span>
                    </button>
                    <span class="status" id="status">Click to record</span>
                </div>
                
                <div class="transcript-box" id="transcript">Transcript will appear here...</div>
                
                <div class="tech-alert" id="techAlert">
                    <p>This sounds like a technical/tooling topic. Switch to Technical folder?</p>
                    <div class="tech-alert-btns">
                        <button class="switch-btn" id="switchBtn">Switch to Technical</button>
                        <button class="keep-btn" id="keepBtn">Keep as Game Dev</button>
                    </div>
                </div>
                
                <button class="save-btn" id="saveBtn" disabled>Save Topic</button>
            </div>
        </div>
        
        <div class="feed-column">
            <div class="feed-card">
                <h3>Recent Topics</h3>
                <div id="topicsFeed">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let currentType = 'game';
        let dayNumber = 1;
        let topicCount = 0;
        
        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        const transcript = document.getElementById('transcript');
        const saveBtn = document.getElementById('saveBtn');
        const topicNumber = document.getElementById('topicNumber');
        const dateDisplay = document.getElementById('dateDisplay');
        const topicsFeed = document.getElementById('topicsFeed');
        const techAlert = document.getElementById('techAlert');
        
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
                loadTopics();
                updateTopicNumber();
            });
        });
        
        document.getElementById('switchBtn').addEventListener('click', () => {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-type="technical"]').classList.add('active');
            currentType = 'technical';
            techAlert.classList.remove('show');
            updateTopicNumber();
        });
        
        document.getElementById('keepBtn').addEventListener('click', () => {
            techAlert.classList.remove('show');
        });
        
        function updateTopicNumber() {
            const prefix = currentType === 'technical' ? 'T' : '';
            topicNumber.textContent = prefix + dayNumber + '.' + (topicCount + 1);
        }
        
        function updateDate() {
            const now = new Date();
            dateDisplay.textContent = now.toLocaleDateString('en-US', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });
        }
        
        async function loadTopics() {
            try {
                const res = await fetch('/api/topics?type=' + currentType);
                const data = await res.json();
                
                if (data.topics.length === 0) {
                    topicsFeed.innerHTML = '<div class="feed-item">No topics yet</div>';
                    topicCount = 0;
                } else {
                    topicsFeed.innerHTML = data.topics.map(t => 
                        '<div class="feed-item">' + t + '</div>'
                    ).join('');
                    topicCount = data.topics.length;
                }
                updateTopicNumber();
            } catch (e) {
                topicsFeed.innerHTML = '<div class="feed-item">Failed to load</div>';
            }
        }
        
        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        status.textContent = 'Transcribing...';
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const formData = new FormData();
                        formData.append('audio', blob);
                        
                        try {
                            const res = await fetch('/api/transcribe', {
                                method: 'POST',
                                body: formData
                            });
                            const data = await res.json();
                            transcript.textContent = data.text;
                            saveBtn.disabled = false;
                            status.textContent = 'Transcription complete';
                            status.classList.remove('recording');
                            
                            if (currentType === 'game' && data.technicalDetected) {
                                techAlert.classList.add('show');
                            }
                        } catch (e) {
                            status.textContent = 'Transcription failed';
                            transcript.textContent = 'Error: ' + e.message;
                        }
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    status.textContent = 'Recording...';
                    status.classList.add('recording');
                } catch (e) {
                    status.textContent = 'Mic access denied';
                }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                recordBtn.classList.remove('recording');
            }
        });
        
        saveBtn.addEventListener('click', async () => {
            const text = transcript.textContent;
            if (!text || text === 'Transcript will appear here...') return;
            
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const prefix = currentType === 'technical' ? 'dev-technical' : 'dev-planning';
            const filename = prefix + '_' + dateStr + '_0001.md';
            const topicNum = (currentType === 'technical' ? 'T' : '') + dayNumber + '.' + (topicCount + 1);
            
            const content = '## ' + topicNum + ' - [Topic Title]\n*' + dateStr + '*\n\n' + text;
            
            saveBtn.textContent = 'Saving...';
            saveBtn.disabled = true;
            
            try {
                const res = await fetch('/api/save-transcript', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, content, type: currentType })
                });
                
                if (res.ok) {
                    saveBtn.textContent = 'Saved!';
                    transcript.textContent = 'Transcript will appear here...';
                    techAlert.classList.remove('show');
                    loadTopics();
                    setTimeout(() => { saveBtn.textContent = 'Save Topic'; }, 2000);
                } else {
                    throw new Error('Save failed');
                }
            } catch (e) {
                saveBtn.textContent = 'Save Failed';
                saveBtn.disabled = false;
            }
        });
        
        updateDate();
        loadTopics();
        
        // Poll for new topics every 5 seconds
        setInterval(loadTopics, 5000);
    </script>
</body>
</html>
