<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Feedback</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            font-size: 14px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }
        
        .header h1 { font-size: 18px; margin: 0; font-weight: 600; }
        
        .type-toggle { display: flex; gap: 4px; }
        
        .type-btn {
            padding: 4px 10px;
            border: 1px solid #444;
            background: transparent;
            color: #888;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .type-btn.active { background: #2a5a2a; color: #fff; border-color: #3a7a3a; }
        
        .recorder {
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .topic-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .topic-number { font-size: 20px; font-weight: 600; color: #6a6; }
        .date { font-size: 12px; color: #666; }
        
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .record-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #c44;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .record-btn .inner {
            width: 20px;
            height: 20px;
            background: #c44;
            border-radius: 50%;
            transition: all 0.15s;
        }
        
        .record-btn.recording .inner {
            border-radius: 3px;
            width: 16px;
            height: 16px;
        }
        
        .status { font-size: 13px; color: #888; }
        .status.recording { color: #c44; }
        .status.error { color: #c44; }
        .status.success { color: #6a6; }
        
        .transcript {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            min-height: 80px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 12px;
        }
        
        .transcript.placeholder { color: #555; }
        
        .save-btn {
            width: 100%;
            padding: 10px;
            background: #2a4a6a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        
        .save-btn:hover { background: #3a5a7a; }
        .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .tech-alert {
            background: rgba(200, 150, 50, 0.15);
            border: 1px solid #a85;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 12px;
            display: none;
            font-size: 12px;
        }
        
        .tech-alert.show { display: block; }
        .tech-alert p { margin: 0 0 8px 0; color: #ca8; }
        .tech-alert-btns { display: flex; gap: 8px; }
        .tech-alert-btns button { padding: 4px 10px; border-radius: 4px; border: none; font-size: 11px; cursor: pointer; }
        .switch-btn { background: #a85; color: #000; }
        .keep-btn { background: #444; color: #ccc; }
        
        .pending-section {
            display: none;
            margin-bottom: 16px;
            background: #2a2020;
            border: 1px solid #633;
            border-radius: 8px;
            padding: 12px;
        }
        
        .pending-section.show { display: block; }
        .pending-section h3 { margin: 0 0 8px 0; font-size: 14px; color: #c66; }
        
        .pending-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #422;
            font-size: 12px;
        }
        
        .pending-item:last-child { border-bottom: none; }
        
        .pending-item button {
            padding: 3px 8px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 4px;
        }
        
        .retry-btn { background: #4a6a8a; color: #fff; }
        .delete-btn { background: #633; color: #ccc; }
        
        .feeds-row { display: flex; gap: 12px; margin-top: 16px; }
        
        .feed {
            flex: 1;
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .feed h3 {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            margin: 0 0 8px 0;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .feed h3 .dot { width: 6px; height: 6px; border-radius: 50%; }
        .feed.game h3 .dot { background: #6a6; }
        .feed.technical h3 .dot { background: #68a; }
        
        .feed-item { border-bottom: 1px solid #333; font-size: 12px; }
        .feed-item:last-child { border-bottom: none; }
        .feed-item summary { padding: 6px 0; cursor: pointer; color: #aaa; list-style: none; }
        .feed-item summary::-webkit-details-marker { display: none; }
        .feed-item summary::before { content: '▸'; display: inline-block; margin-right: 6px; font-size: 10px; color: #555; transition: transform 0.15s; }
        .feed-item[open] summary::before { transform: rotate(90deg); }
        .feed-item .content { padding: 8px 0 8px 16px; color: #888; font-size: 11px; line-height: 1.5; white-space: pre-wrap; }
        
        .move-btn {
            margin-top: 8px;
            padding: 3px 8px;
            background: #3a3a3a;
            color: #999;
            border: 1px solid #555;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
        }
        
        .move-btn:hover { background: #4a4a4a; color: #ccc; }
        
        @media (max-width: 500px) {
            .feeds-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dev Feedback</h1>
        <div class="type-toggle">
            <button class="type-btn active" data-type="game">Game</button>
            <button class="type-btn" data-type="technical">Technical</button>
        </div>
    </div>
    
    <div class="recorder">
        <div class="topic-row">
            <span class="topic-number" id="topicNumber">1.1</span>
            <span class="date" id="dateDisplay"></span>
        </div>
        
        <div class="controls">
            <button class="record-btn" id="recordBtn">
                <span class="inner"></span>
            </button>
            <span class="status" id="status">Click to record</span>
            <a id="downloadLink" style="display:none; margin-left: auto; font-size: 11px; color: #68a; text-decoration: underline; cursor: pointer;">Download Audio</a>
        </div>
        
        <div class="transcript placeholder" id="transcript">Transcript will appear here...</div>
        
        <div class="tech-alert" id="techAlert">
            <p>Sounds like a technical topic. Switch folder?</p>
            <div class="tech-alert-btns">
                <button class="switch-btn" id="switchBtn">Switch</button>
                <button class="keep-btn" id="keepBtn">Keep</button>
            </div>
        </div>
        
        <button class="save-btn" id="saveBtn" disabled>Save Topic</button>
    </div>
    
    <div class="pending-section" id="pendingSection">
        <h3>Pending Uploads <button onclick="retryAllPending()" style="margin-left:8px; padding:3px 8px; background:#4a6a8a; color:#fff; border:none; border-radius:3px; cursor:pointer; font-size:11px;">Retry All</button></h3>
        <div id="pendingList"></div>
    </div>
    
    <div class="feeds-row">
        <div class="feed game">
            <h3><span class="dot"></span>Game Dev</h3>
            <div id="gameFeed">Loading...</div>
        </div>
        <div class="feed technical">
            <h3><span class="dot"></span>Technical</h3>
            <div id="techFeed">Loading...</div>
        </div>
    </div>

    <script>
        // ============================================
        // SIMPLE STATE
        // ============================================
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let currentType = 'game';
        let dayNumber = 1;
        let topicCount = 0;
        let lastAudioBlob = null;
        
        // ============================================
        // SIMPLE PENDING QUEUE (localStorage)
        // ============================================
        function getPendingQueue() {
            try {
                return JSON.parse(localStorage.getItem('pendingAudio') || '[]');
            } catch { return []; }
        }
        
        function savePendingQueue(queue) {
            localStorage.setItem('pendingAudio', JSON.stringify(queue));
        }
        
        function addToPending(base64Audio, topicNum, type) {
            const queue = getPendingQueue();
            queue.push({ 
                id: Date.now(), 
                audio: base64Audio, 
                topicNum, 
                type, 
                timestamp: Date.now() 
            });
            savePendingQueue(queue);
            renderPending();
        }
        
        function removeFromPending(id) {
            const queue = getPendingQueue().filter(p => p.id !== id);
            savePendingQueue(queue);
            renderPending();
        }
        
        function renderPending() {
            const queue = getPendingQueue();
            const section = document.getElementById('pendingSection');
            const list = document.getElementById('pendingList');
            
            if (queue.length === 0) {
                section.classList.remove('show');
                return;
            }
            
            section.classList.add('show');
            list.innerHTML = queue.map(p => {
                const time = new Date(p.timestamp).toLocaleTimeString();
                const size = Math.round(p.audio.length * 0.75 / 1024) + 'KB';
                return `<div class="pending-item">
                    <span>${p.topicNum} - ${time} (${size})</span>
                    <div>
                        <button class="retry-btn" onclick="retryOne(${p.id})">Retry</button>
                        <button class="delete-btn" onclick="removeFromPending(${p.id})">Delete</button>
                    </div>
                </div>`;
            }).join('');
        }
        
        // Convert blob to base64 for localStorage
        async function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }
        
        // Convert base64 back to blob
        function base64ToBlob(base64, type = 'audio/webm') {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new Blob([bytes], { type });
        }
        
        // ============================================
        // TRANSCRIPTION (one simple function)
        // ============================================
        async function transcribe(blob) {
            const formData = new FormData();
            formData.append('audio', blob);
            
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 90000); // 90s timeout
            
            try {
                const res = await fetch('/api/transcribe', {
                    method: 'POST',
                    body: formData,
                    signal: controller.signal
                });
                clearTimeout(timeout);
                
                const text = await res.text();
                
                // Check for server errors
                if (res.status >= 500 || text.includes('UNAVAILABLE') || text.includes('deploy')) {
                    return { error: 'Service temporarily unavailable', retry: true };
                }
                
                try {
                    const data = JSON.parse(text);
                    if (data.error) return { error: data.error, retry: false };
                    if (data.text) return { text: data.text, technical: data.technicalDetected };
                    return { error: 'No transcription returned', retry: false };
                } catch {
                    return { error: 'Invalid response', retry: true };
                }
            } catch (e) {
                clearTimeout(timeout);
                if (e.name === 'AbortError') {
                    return { error: 'Request timed out', retry: true };
                }
                return { error: e.message, retry: true };
            }
        }
        
        // Clean up transcript via AI
        async function cleanupTranscript(text, topicNum) {
            try {
                const res = await fetch('/api/cleanup-transcript', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, topicNumber: topicNum })
                });
                const data = await res.json();
                return data.cleaned || text;
            } catch {
                return text;
            }
        }
        
        // ============================================
        // UI ELEMENTS
        // ============================================
        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        const transcript = document.getElementById('transcript');
        const saveBtn = document.getElementById('saveBtn');
        const topicNumber = document.getElementById('topicNumber');
        const dateDisplay = document.getElementById('dateDisplay');
        const gameFeed = document.getElementById('gameFeed');
        const techFeed = document.getElementById('techFeed');
        const techAlert = document.getElementById('techAlert');
        const downloadLink = document.getElementById('downloadLink');
        
        function log(msg, type = '') {
            status.textContent = msg;
            status.className = 'status ' + type;
            console.log('[DevFeedback]', msg);
        }
        
        function updateTopicNumber() {
            const prefix = currentType === 'technical' ? 'T' : '';
            topicNumber.textContent = prefix + dayNumber + '.' + (topicCount + 1);
        }
        
        function updateDate() {
            const now = new Date();
            dateDisplay.textContent = now.toLocaleDateString('en-US', { 
                month: 'short', day: 'numeric', year: 'numeric' 
            });
        }
        
        // ============================================
        // RECORDING
        // ============================================
        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    log('Requesting mic...');
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        lastAudioBlob = blob;
                        
                        // Create download link backup
                        downloadLink.href = URL.createObjectURL(blob);
                        downloadLink.download = 'recording-' + Date.now() + '.webm';
                        downloadLink.style.display = 'inline';
                        
                        await processRecording(blob);
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    log('Recording...', 'recording');
                } catch (e) {
                    log('Mic denied: ' + e.message, 'error');
                }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                recordBtn.classList.remove('recording');
            }
        });
        
        // ============================================
        // PROCESS RECORDING (with auto-retry)
        // ============================================
        async function processRecording(blob, maxRetries = 3) {
            log('Transcribing...');
            
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                const result = await transcribe(blob);
                
                if (result.text) {
                    // Success! Clean it up
                    transcript.textContent = result.text;
                    transcript.classList.remove('placeholder');
                    
                    log('Cleaning up...');
                    const cleaned = await cleanupTranscript(result.text, topicNumber.textContent);
                    transcript.textContent = cleaned;
                    
                    saveBtn.disabled = false;
                    log('Ready to save', 'success');
                    
                    if (currentType === 'game' && result.technical) {
                        techAlert.classList.add('show');
                    }
                    return true;
                }
                
                if (result.retry && attempt < maxRetries) {
                    const wait = attempt * 5;
                    log(`${result.error}, retry in ${wait}s (${attempt}/${maxRetries})...`);
                    await new Promise(r => setTimeout(r, wait * 1000));
                    continue;
                }
                
                // Final failure - save to pending
                log('Failed - saved to pending', 'error');
                transcript.textContent = 'Error: ' + result.error;
                transcript.classList.remove('placeholder');
                
                const base64 = await blobToBase64(blob);
                addToPending(base64, topicNumber.textContent, currentType);
                return false;
            }
        }
        
        // ============================================
        // RETRY PENDING
        // ============================================
        async function retryOne(id) {
            const queue = getPendingQueue();
            const item = queue.find(p => p.id === id);
            if (!item) return;
            
            log('Retrying...');
            const blob = base64ToBlob(item.audio);
            
            const result = await transcribe(blob);
            if (result.text) {
                log('Success!', 'success');
                transcript.textContent = result.text;
                transcript.classList.remove('placeholder');
                
                const cleaned = await cleanupTranscript(result.text, item.topicNum);
                transcript.textContent = cleaned;
                
                currentType = item.type;
                document.querySelectorAll('.type-btn').forEach(b => 
                    b.classList.toggle('active', b.dataset.type === currentType));
                
                saveBtn.disabled = false;
                removeFromPending(id);
            } else {
                log('Still failing: ' + result.error, 'error');
            }
        }
        
        async function retryAllPending() {
            const queue = getPendingQueue();
            if (queue.length === 0) return;
            
            log(`Retrying ${queue.length} pending...`);
            
            for (const item of queue) {
                const blob = base64ToBlob(item.audio);
                const result = await transcribe(blob);
                
                if (result.text) {
                    // Auto-save successful retries
                    const cleaned = await cleanupTranscript(result.text, item.topicNum);
                    await saveToGitHub(item.topicNum, cleaned, item.type);
                    removeFromPending(item.id);
                }
            }
            
            loadAllFeeds();
            log('Retry complete', 'success');
        }
        
        // ============================================
        // SAVE TO GITHUB
        // ============================================
        async function saveToGitHub(topicNum, text, type) {
            // Generate title
            let title = '[Untitled]';
            try {
                const res = await fetch('/api/generate-title', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if (data.title && data.title !== 'Untitled Topic') {
                    title = data.title;
                }
            } catch {}
            
            const dateStr = new Date().toISOString().split('T')[0];
            const prefix = type === 'technical' ? 'dev-technical' : 'dev-planning';
            const filename = prefix + '_' + dateStr + '_0001.md';
            const content = '## ' + topicNum + ' - ' + title + '\n*' + dateStr + '*\n\n' + text;
            
            const res = await fetch('/api/save-transcript', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename, content, type })
            });
            
            return res.ok;
        }
        
        saveBtn.addEventListener('click', async () => {
            const text = transcript.textContent;
            if (!text || transcript.classList.contains('placeholder')) {
                log('Nothing to save', 'error');
                return;
            }
            
            saveBtn.textContent = 'Saving...';
            saveBtn.disabled = true;
            log('Saving...');
            
            try {
                const success = await saveToGitHub(topicNumber.textContent, text, currentType);
                
                if (success) {
                    log('Saved!', 'success');
                    transcript.textContent = 'Transcript will appear here...';
                    transcript.classList.add('placeholder');
                    techAlert.classList.remove('show');
                    loadAllFeeds();
                } else {
                    log('Save failed', 'error');
                }
            } catch (e) {
                log('Save failed: ' + e.message, 'error');
            }
            
            saveBtn.textContent = 'Save Topic';
            saveBtn.disabled = true;
        });
        
        // ============================================
        // TYPE TOGGLE
        // ============================================
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
                updateTopicNumber();
            });
        });
        
        document.getElementById('switchBtn').addEventListener('click', () => {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-type="technical"]').classList.add('active');
            currentType = 'technical';
            techAlert.classList.remove('show');
            updateTopicNumber();
        });
        
        document.getElementById('keepBtn').addEventListener('click', () => {
            techAlert.classList.remove('show');
        });
        
        // ============================================
        // LOAD FEEDS
        // ============================================
        async function loadFeed(type, container) {
            try {
                const res = await fetch('/api/topics?type=' + type + '&full=1');
                const data = await res.json();
                
                if (data.topics.length === 0) {
                    container.innerHTML = '<div class="feed-item"><summary>No topics yet</summary></div>';
                    return 0;
                }
                
                const targetType = type === 'game' ? 'technical' : 'game';
                const targetLabel = type === 'game' ? 'Move to Technical' : 'Move to Game';
                
                container.innerHTML = data.topics.map(t => 
                    `<details class="feed-item">
                        <summary>${t.title}</summary>
                        <div class="content">${t.content || ''}
                            <button class="move-btn" data-topic="${t.title}" data-from="${type}" data-to="${targetType}">${targetLabel}</button>
                        </div>
                    </details>`
                ).join('');
                
                container.querySelectorAll('.move-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        btn.textContent = 'Moving...';
                        btn.disabled = true;
                        
                        try {
                            const res = await fetch('/api/move-topic', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ 
                                    topic: btn.dataset.topic, 
                                    fromType: btn.dataset.from, 
                                    toType: btn.dataset.to 
                                })
                            });
                            if (res.ok) loadAllFeeds();
                        } catch {}
                    });
                });
                
                return data.topics.length;
            } catch {
                container.innerHTML = '<div class="feed-item"><summary>Failed to load</summary></div>';
                return 0;
            }
        }
        
        async function loadAllFeeds() {
            const gameCount = await loadFeed('game', gameFeed);
            await loadFeed('technical', techFeed);
            topicCount = currentType === 'game' ? gameCount : 0;
            updateTopicNumber();
        }
        
        // ============================================
        // INIT
        // ============================================
        updateDate();
        renderPending();
        loadAllFeeds();
        
        // Auto-refresh feeds
        setInterval(loadAllFeeds, 5000);
        
        // Auto-retry pending on load (once, after 3 seconds)
        setTimeout(() => {
            const queue = getPendingQueue();
            if (queue.length > 0) {
                console.log('[DevFeedback] Auto-retrying pending on load...');
                retryAllPending();
            }
        }, 3000);
    </script>
</body>
</html>
