<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overflow: hidden;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .panel-controls {
            position: relative;
            height: 26px;
            flex-shrink: 0;
        }

        .chevron-group {
            position: absolute;
            top: 8px;
            left: calc(12px + (100% - 36px) * 0.55 + 6px);
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            transition: left 0.25s ease, transform 0.25s ease;
        }

        .panel-chevron {
            width: 22px;
            height: 18px;
            border: 1px solid var(--card-border);
            border-radius: 3px;
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: opacity 0.15s ease;
        }

        .panel-chevron:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
            background: rgba(255,255,255,0.06);
        }

        .panel-chevron.hidden {
            display: none;
        }

        .page-wrapper.expand-right .chevron-group {
            left: 12px;
            transform: translateX(0);
        }

        .page-wrapper.expand-left .chevron-group {
            left: calc(100% - 12px);
            transform: translateX(-100%);
        }

        .container {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 12px;
            padding: 6px 12px 12px 12px;
        }

        .left-panel {
            width: 55%;
            height: 100%;
            overflow-y: auto;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            background: var(--card-bg);
            transition: width 0.25s ease, padding 0.25s ease, border-color 0.25s ease, opacity 0.25s ease;
        }

        .right-panel {
            width: 45%;
            height: 100%;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            transition: width 0.25s ease, padding 0.25s ease, border-color 0.25s ease, opacity 0.25s ease;
        }

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--card-border);
            flex-shrink: 0;
        }

        .panel-tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .panel-tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent-red);
        }

        .tab-content {
            display: none;
            flex: 1;
            min-height: 0;
        }

        .tab-content.active {
            display: flex;
        }

        .labels-col {
            width: 44px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 34px 0 12px 0;
        }

        .pos-label {
            flex: 1;
            min-height: 0;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .pos-label.drop-ineligible {
            opacity: 0.3;
        }

        .pills-area {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            min-width: 0;
            padding: 0 12px 12px 0;
        }

        .pills-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            min-width: calc(300%);
        }

        .column-headers {
            display: flex;
            gap: 8px;
            padding: 12px 2px 2px;
            flex-shrink: 0;
        }

        .column-headers span {
            flex: 1;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            text-align: center;
        }

        .pill-row {
            flex: 1;
            min-height: 0;
            display: flex;
            gap: 8px;
            border-radius: 6px;
            padding: 2px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .pill-row.drop-ineligible {
            opacity: 0.3;
        }

        .pos-pill {
            flex: 1;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            display: flex;
            align-items: stretch;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.15);
            cursor: grab;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
            padding: 0;
            overflow: hidden;
            min-width: 0;
        }

        .pos-pill:active {
            cursor: grabbing;
        }

        .pos-pill:hover {
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .pill-grade {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            flex-shrink: 0;
            font-family: 'Teko', sans-serif;
            font-size: 16px;
            font-weight: 600;
            line-height: 1;
            color: #fff;
            border-right: 1px solid rgba(255,255,255,0.06);
        }

        .pill-grade.grade-elite { background: rgba(212, 175, 55, 0.3); color: #f0d060; }
        .pill-grade.grade-great { background: rgba(74, 222, 128, 0.2); color: #4ade80; }
        .pill-grade.grade-above { background: rgba(56, 189, 248, 0.18); color: #38bdf8; }
        .pill-grade.grade-avg { background: rgba(255,255,255,0.06); color: #94a3b8; }
        .pill-grade.grade-below { background: rgba(248, 113, 113, 0.15); color: #f87171; }

        .pill-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3px 6px;
            gap: 1px;
        }

        .pill-name {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
            color: #e2e8f0;
        }

        .pill-stats {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
            letter-spacing: 0.02em;
        }

        .pill-stats .stat-val {
            color: #94a3b8;
            font-weight: 600;
        }

        .pill-stats .stat-sep {
            color: rgba(255,255,255,0.15);
            margin: 0 2px;
        }

        .pos-pill.empty-slot {
            border: 1px dashed rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.015);
            cursor: default;
            opacity: 1;
        }

        .pos-pill.empty-slot:hover {
            transform: none;
            box-shadow: none;
            border-color: rgba(255,255,255,0.08);
        }

        .pos-pill.drag-source {
            opacity: 0.25;
            transform: scale(0.95);
        }

        .pos-pill.drag-source.insert-target .pill-name {
            visibility: hidden;
        }

        .pos-pill.drag-clone {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.95;
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-color: rgba(74, 222, 128, 0.5);
            transition: none;
        }

        .pos-pill.shift-preview {
            opacity: 0.7;
        }

        .pos-pill.insert-target {
            background: rgba(74, 222, 128, 0.12);
            border-color: rgba(74, 222, 128, 0.35);
            box-shadow: inset 0 0 0 1px rgba(74, 222, 128, 0.1);
        }


        .pos-pill.starter {
            border-left: 2px solid var(--accent-red);
        }

        .pos-pill.cross-move {
            animation: crossMoveFlash 0.5s ease;
        }

        @keyframes crossMoveFlash {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
            50% { box-shadow: 0 0 12px 2px rgba(74, 222, 128, 0.3); }
            100% { box-shadow: none; }
        }

        .pills-area::-webkit-scrollbar {
            display: none;
        }
        .pills-area {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .container.expand-right .left-panel {
            width: 0;
            padding: 0;
            border-color: transparent;
            overflow: hidden;
        }

        .container.expand-right .right-panel {
            width: 100%;
        }

        .container.expand-right .pills-grid {
            min-width: 0;
            width: 100%;
        }

        .container.expand-right .pills-area {
            overflow-x: hidden;
        }

        .container.expand-left .right-panel {
            width: 0;
            border-color: transparent;
            overflow: hidden;
        }

        .container.expand-left .left-panel {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="app-header">
            <div style="display: flex; align-items: center; gap: 12px">
                <a href="index.html" class="logo-blocks">
                    <span class="gm">GM</span>
                    <span class="ops"><span class="o">O</span><span class="ps">PS</span></span>
                </a>
                <div class="mode-indicator offseason" style="background: rgba(212, 175, 55, 0.15); border: 1px solid rgba(212, 175, 55, 0.3);">
                    <span class="mode-dot" style="background: #D4AF37;"></span>
                    <span>Offseason Mode</span>
                </div>
            </div>
            <div class="header-nav">
                <a href="index.html">Home</a>
                <div class="user-menu">
                    <span class="user-avatar">G</span>
                    <span>Guest</span>
                </div>
            </div>
        </header>

        <div class="panel-controls">
            <div class="chevron-group">
                <div class="panel-chevron" id="chevronLeft" title="Expand roster panel">&#x276E;</div>
                <div class="panel-chevron" id="chevronRight" title="Expand main panel">&#x276F;</div>
            </div>
        </div>

        <div class="container" id="mainContainer">
            <div class="left-panel">
            </div>
            <div class="right-panel">
                <div class="panel-tabs">
                    <div class="panel-tab active" data-tab="offense">Offense</div>
                    <div class="panel-tab" data-tab="defense">Defense</div>
                    <div class="panel-tab" data-tab="special">Special Teams</div>
                    <div class="panel-tab" data-tab="tools">Tools</div>
                </div>

                <div class="tab-content active" id="tab-offense"></div>
                <div class="tab-content" id="tab-defense"></div>
                <div class="tab-content" id="tab-special"></div>
                <div class="tab-content" id="tab-tools"></div>
            </div>
        </div>
    </div>

    <script>
        const DEPTH_SLOTS = 6;
        const TEAM = 'ARI';
        let playerLookup = {};

        const POSITION_COMPAT = {
            'QB':   [],
            'RB':   ['WR'],
            'WR':   ['RB'],
            'TE':   ['WR'],
            'LT':   ['LG', 'C', 'RG', 'RT'],
            'LG':   ['LT', 'C', 'RG', 'RT'],
            'C':    ['LT', 'LG', 'RG', 'RT'],
            'RG':   ['LT', 'LG', 'C', 'RT'],
            'RT':   ['LT', 'LG', 'C', 'RG'],
            'DT':   ['EDGE'],
            'EDGE': ['DT', 'LB'],
            'LB':   ['EDGE', 'SS', 'FS'],
            'CB':   ['NCB', 'SS', 'FS'],
            'NCB':  ['CB', 'SS', 'FS'],
            'SS':   ['FS', 'CB', 'NCB', 'LB'],
            'FS':   ['SS', 'CB', 'NCB', 'LB'],
            'K':    [],
            'P':    [],
        };

        const DC_POS_TO_STAT_POS = {
            QB: 'QB', RB: 'RB', WR: 'WR', TE: 'TE',
            LT: 'OL', LG: 'OL', C: 'OL', RG: 'OL', RT: 'OL',
            DT: 'DL', EDGE: 'EDGE', LB: 'LB',
            CB: 'CB', NCB: 'CB', SS: 'S', FS: 'S',
            K: 'K', P: 'P',
        };

        function getGradeClass(grade) {
            if (grade >= 90) return 'grade-elite';
            if (grade >= 80) return 'grade-great';
            if (grade >= 70) return 'grade-above';
            if (grade >= 60) return 'grade-avg';
            return 'grade-below';
        }

        function formatStat(val) {
            if (val == null) return '—';
            if (val >= 1000) return (val / 1000).toFixed(1) + 'k';
            return String(Math.round(val * 10) / 10);
        }

        function getStatsHtml(dcPos, pff) {
            if (!pff || !pff.stats) return '';
            const s = pff.stats;
            const statPos = DC_POS_TO_STAT_POS[dcPos] || dcPos;

            const parts = [];
            switch (statPos) {
                case 'QB':
                    if (s.passYards != null) parts.push(`<span class="stat-val">${formatStat(s.passYards)}</span> YD`);
                    if (s.passTDs != null) parts.push(`<span class="stat-val">${s.passTDs}</span> TD`);
                    break;
                case 'RB':
                    if (s.rushYards != null) parts.push(`<span class="stat-val">${formatStat(s.rushYards)}</span> YD`);
                    if (s.rushTDs != null) parts.push(`<span class="stat-val">${s.rushTDs}</span> TD`);
                    break;
                case 'WR':
                case 'TE':
                    if (s.recYards != null) parts.push(`<span class="stat-val">${formatStat(s.recYards)}</span> YD`);
                    if (s.receptions != null) parts.push(`<span class="stat-val">${s.receptions}</span> REC`);
                    break;
                case 'OL':
                    if (s.pressuresAllowed != null) parts.push(`<span class="stat-val">${s.pressuresAllowed}</span> PRES`);
                    if (s.runBlockGrade != null) parts.push(`<span class="stat-val">${s.runBlockGrade}</span> RBG`);
                    break;
                case 'EDGE':
                case 'DL':
                    if (s.sacks != null) parts.push(`<span class="stat-val">${s.sacks}</span> SK`);
                    if (s.totalPressures != null) parts.push(`<span class="stat-val">${s.totalPressures}</span> PRES`);
                    break;
                case 'LB':
                    if (s.tackles != null) parts.push(`<span class="stat-val">${s.tackles}</span> TK`);
                    if (s.sacks != null) parts.push(`<span class="stat-val">${s.sacks}</span> SK`);
                    break;
                case 'CB':
                    if (s.interceptions != null) parts.push(`<span class="stat-val">${s.interceptions}</span> INT`);
                    if (s.passBreakups != null) parts.push(`<span class="stat-val">${s.passBreakups}</span> PBU`);
                    break;
                case 'S':
                    if (s.interceptions != null) parts.push(`<span class="stat-val">${s.interceptions}</span> INT`);
                    if (s.tackles != null) parts.push(`<span class="stat-val">${s.tackles}</span> TK`);
                    break;
                case 'K':
                    if (s.fgPct != null) parts.push(`<span class="stat-val">${s.fgPct}%</span> FG`);
                    break;
                case 'P':
                    if (s.avgYards != null) parts.push(`<span class="stat-val">${s.avgYards}</span> AVG`);
                    break;
            }
            return parts.join('<span class="stat-sep">·</span>');
        }

        const offenseData = [
            { pos: 'QB', players: ['Jacoby Brissett', 'Kedon Slovis'] },
            { pos: 'RB', players: ['Michael Carter', 'Emari Demercado'] },
            { pos: 'WR', players: ['Michael Wilson', 'Tejhaun Palmer'] },
            { pos: 'WR', players: ['Xavier Weaver', 'Bryson Green'] },
            { pos: 'WR', players: ['Jalen Brooks', 'Ihmir Smith-Marsette'] },
            { pos: 'TE', players: ['Trey McBride', 'Elijah Higgins'] },
            { pos: 'LT', players: ['Josh Fryar', 'Paris Johnson Jr.'] },
            { pos: 'LG', players: ['Evan Brown', 'Jon Gaines II'] },
            { pos: 'C',  players: ['Hjalte Froholdt', 'Jon Gaines II'] },
            { pos: 'RG', players: ['Isaiah Adams', 'Will Hernandez'] },
            { pos: 'RT', players: ['Kelvin Beachum', 'Christian Jones'] },
        ];

        const defenseData = [
            { pos: 'DT',   players: ['Calais Campbell', 'PJ Mustipher'] },
            { pos: 'DT',   players: ['Dalvin Tomlinson', 'L.J. Collier'] },
            { pos: 'EDGE', players: ['Josh Sweat', 'Jordan Burch'] },
            { pos: 'EDGE', players: ['Darius Robinson', 'Dante Stills'] },
            { pos: 'LB',   players: ['Akeem Davis-Gaither', 'Zaven Collins'] },
            { pos: 'LB',   players: ['Cody Simon', 'Owen Pappoe'] },
            { pos: 'CB',   players: ['Will Johnson', 'Elijah Jones'] },
            { pos: 'CB',   players: ['Denzel Burke', 'Max Melton'] },
            { pos: 'NCB',  players: ['Darren Hall', 'Jaden Davis'] },
            { pos: 'SS',   players: ['Jalen Thompson', 'Kitan Crawford'] },
            { pos: 'FS',   players: ['Budda Baker', 'Dadrion Taylor-Demerson'] },
        ];

        const specialData = [
            { pos: 'K', players: ['Chad Ryland'] },
            { pos: 'P', players: ['Blake Hayes'] },
        ];

        const depthLabels = ['1ST STRING', '2ND STRING', '3RD STRING', '4TH STRING', '5TH STRING', '6TH STRING'];

        function getCompatiblePositions(pos) {
            const compat = new Set(POSITION_COMPAT[pos] || []);
            compat.add(pos);
            return compat;
        }

        function buildTab(tabEl, data) {
            const labelsCol = document.createElement('div');
            labelsCol.className = 'labels-col';

            const pillsArea = document.createElement('div');
            pillsArea.className = 'pills-area';
            const pillsGrid = document.createElement('div');
            pillsGrid.className = 'pills-grid';

            const headerRow = document.createElement('div');
            headerRow.className = 'column-headers';
            for (let i = 0; i < DEPTH_SLOTS; i++) {
                const hdr = document.createElement('span');
                hdr.textContent = depthLabels[i];
                headerRow.appendChild(hdr);
            }
            pillsGrid.appendChild(headerRow);

            data.forEach((row, rowIndex) => {
                const label = document.createElement('div');
                label.className = 'pos-label';
                label.textContent = row.pos;
                label.dataset.pos = row.pos;
                label.dataset.rowIndex = rowIndex;
                labelsCol.appendChild(label);

                const pillRow = document.createElement('div');
                pillRow.className = 'pill-row';
                pillRow.dataset.pos = row.pos;
                pillRow.dataset.rowIndex = rowIndex;

                for (let i = 0; i < DEPTH_SLOTS; i++) {
                    const pill = document.createElement('div');
                    pill.className = 'pos-pill';
                    pill.dataset.pos = row.pos;

                    if (row.players[i]) {
                        pill.dataset.player = row.players[i];
                        if (i === 0) pill.classList.add('starter');

                        const pff = playerLookup[row.players[i]];
                        if (pff && pff.grade != null) {
                            const gradeEl = document.createElement('div');
                            gradeEl.className = 'pill-grade ' + getGradeClass(pff.grade);
                            gradeEl.textContent = Math.round(pff.grade);
                            pill.appendChild(gradeEl);
                        }

                        const body = document.createElement('div');
                        body.className = 'pill-body';

                        const nameEl = document.createElement('div');
                        nameEl.className = 'pill-name';
                        nameEl.textContent = row.players[i];
                        body.appendChild(nameEl);

                        if (pff) {
                            const statsEl = document.createElement('div');
                            statsEl.className = 'pill-stats';
                            statsEl.innerHTML = getStatsHtml(row.pos, pff);
                            if (statsEl.innerHTML) body.appendChild(statsEl);
                        }

                        pill.appendChild(body);
                    } else {
                        pill.classList.add('empty-slot');
                    }

                    pillRow.appendChild(pill);
                }

                pillsGrid.appendChild(pillRow);
            });

            pillsArea.appendChild(pillsGrid);
            tabEl.appendChild(labelsCol);
            tabEl.appendChild(pillsArea);

            initDragDrop(tabEl);
        }

        function updateDepthLabels(row) {
            const pills = row.querySelectorAll('.pos-pill');
            pills.forEach((pill, i) => {
                pill.classList.toggle('starter', i === 0 && !pill.classList.contains('empty-slot'));
            });
        }

        function createEmptyPill(pos) {
            const pill = document.createElement('div');
            pill.className = 'pos-pill empty-slot';
            pill.dataset.pos = pos;
            return pill;
        }

        function rebuildRow(row) {
            const pos = row.dataset.pos;
            const pills = Array.from(row.querySelectorAll('.pos-pill'));
            const filled = pills.filter(p => !p.classList.contains('empty-slot'));
            row.innerHTML = '';
            filled.forEach(p => row.appendChild(p));
            for (let i = filled.length; i < DEPTH_SLOTS; i++) {
                row.appendChild(createEmptyPill(pos));
            }
            updateDepthLabels(row);
        }

        let dragState = null;

        function initDragDrop(tabEl) {
            const rows = tabEl.querySelectorAll('.pill-row');
            const labels = tabEl.querySelectorAll('.pos-label');

            rows.forEach(row => {
                row.addEventListener('mousedown', onMouseDown);
                row.addEventListener('touchstart', onTouchStart, { passive: false });
            });

            function onTouchStart(e) {
                const pill = e.target.closest('.pos-pill');
                if (!pill || pill.classList.contains('empty-slot')) return;
                e.preventDefault();
                const touch = e.touches[0];
                startDrag(pill, touch.clientX, touch.clientY);
            }

            function onMouseDown(e) {
                if (e.button !== 0) return;
                const pill = e.target.closest('.pos-pill');
                if (!pill || pill.classList.contains('empty-slot')) return;
                e.preventDefault();
                startDrag(pill, e.clientX, e.clientY);
            }

            function startDrag(pill, startX, startY) {
                const fromRow = pill.closest('.pill-row');
                const fromIndex = Array.from(fromRow.children).indexOf(pill);
                const rect = pill.getBoundingClientRect();
                const compat = getCompatiblePositions(pill.dataset.pos);

                const clone = pill.cloneNode(true);
                clone.classList.add('drag-clone');
                clone.style.width = rect.width + 'px';
                clone.style.height = rect.height + 'px';
                clone.style.left = rect.left + 'px';
                clone.style.top = rect.top + 'px';
                document.body.appendChild(clone);

                pill.classList.add('drag-source');

                rows.forEach((r, i) => {
                    if (!compat.has(r.dataset.pos)) {
                        r.classList.add('drop-ineligible');
                        labels[i].classList.add('drop-ineligible');
                    }
                });

                dragState = {
                    pill, clone, fromRow, fromIndex, compat,
                    offsetX: startX - rect.left,
                    offsetY: startY - rect.top,
                    lastHoverRow: null,
                    lastHoverIndex: -1
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd);
            }

            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                handleMove(touch.clientX, touch.clientY);
            }

            function onMouseMove(e) {
                handleMove(e.clientX, e.clientY);
            }

            function handleMove(clientX, clientY) {
                if (!dragState) return;
                const { clone, compat, offsetX, offsetY } = dragState;

                clone.style.left = (clientX - offsetX) + 'px';
                clone.style.top = (clientY - offsetY) + 'px';

                let hoverRow = null;
                let hoverIndex = -1;

                rows.forEach(r => {
                    if (!compat.has(r.dataset.pos)) return;
                    const rRect = r.getBoundingClientRect();
                    if (clientY >= rRect.top && clientY <= rRect.bottom &&
                        clientX >= rRect.left && clientX <= rRect.right) {
                        hoverRow = r;
                        const pillEls = Array.from(r.children);
                        for (let i = 0; i < pillEls.length; i++) {
                            if (pillEls[i].classList.contains('drag-source')) continue;
                            const pRect = pillEls[i].getBoundingClientRect();
                            if (clientX < pRect.left + pRect.width / 2) {
                                hoverIndex = i;
                                return;
                            }
                        }
                        hoverIndex = pillEls.length;
                    }
                });

                if (hoverRow !== dragState.lastHoverRow || hoverIndex !== dragState.lastHoverIndex) {
                    clearPreview();
                    dragState.lastHoverRow = hoverRow;
                    dragState.lastHoverIndex = hoverIndex;
                    if (hoverRow && hoverIndex >= 0) {
                        showPreview(hoverRow, hoverIndex);
                    }
                }
            }

            function showPreview(targetRow, hoverIndex) {
                clearPreview();
                const { pill, fromRow, fromIndex } = dragState;
                const sameRow = targetRow === fromRow;
                const gap = 8;
                const targetPills = Array.from(targetRow.children);
                const clampedIndex = Math.min(hoverIndex, targetPills.length - 1);

                if (sameRow) {
                    const pillWidth = targetPills[0].getBoundingClientRect().width;
                    const shift = pillWidth + gap;
                    let effectiveInsert = hoverIndex;
                    if (fromIndex < hoverIndex) effectiveInsert--;
                    if (effectiveInsert === fromIndex) return;

                    pill.style.transform = `translateX(${(effectiveInsert - fromIndex) * shift}px)`;
                    pill.classList.add('insert-target');

                    targetPills.forEach((p, i) => {
                        if (i === fromIndex) return;
                        if (p.classList.contains('empty-slot')) return;
                        if (effectiveInsert < fromIndex) {
                            if (i >= effectiveInsert && i < fromIndex) {
                                p.style.transform = `translateX(${shift}px)`;
                                p.classList.add('shift-preview');
                            }
                        } else {
                            if (i > fromIndex && i <= effectiveInsert + 1) {
                                p.style.transform = `translateX(-${shift}px)`;
                                p.classList.add('shift-preview');
                            }
                        }
                    });
                } else {
                    const sourcePills = Array.from(fromRow.children);
                    const sourceShift = sourcePills[0].getBoundingClientRect().width + gap;
                    sourcePills.forEach((p, i) => {
                        if (i > fromIndex && !p.classList.contains('empty-slot')) {
                            p.style.transform = `translateX(-${sourceShift}px)`;
                            p.classList.add('shift-preview');
                        }
                    });

                    targetPills[clampedIndex].classList.add('insert-target');
                    const targetShift = targetPills[0].getBoundingClientRect().width + gap;
                    targetPills.forEach((p, i) => {
                        if (i >= clampedIndex && !p.classList.contains('empty-slot')) {
                            p.style.transform = `translateX(${targetShift}px)`;
                            p.classList.add('shift-preview');
                        }
                    });
                }
            }

            function clearPreview() {
                if (dragState && dragState.pill) {
                    dragState.pill.classList.remove('insert-target');
                    dragState.pill.style.transform = '';
                }
                rows.forEach(r => {
                    Array.from(r.children).forEach(p => {
                        p.classList.remove('shift-preview', 'insert-target');
                        p.style.transform = '';
                    });
                });
            }

            function onTouchEnd(e) {
                finishDrag();
            }

            function onMouseUp(e) {
                finishDrag();
            }

            function finishDrag() {
                if (!dragState) return;
                const { pill, clone, fromRow, fromIndex, lastHoverRow, lastHoverIndex } = dragState;

                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
                document.removeEventListener('touchmove', onTouchMove);
                document.removeEventListener('touchend', onTouchEnd);

                clone.remove();
                pill.classList.remove('drag-source');
                clearPreview();

                rows.forEach((r, i) => {
                    r.classList.remove('drop-ineligible');
                    labels[i].classList.remove('drop-ineligible');
                });

                if (lastHoverRow && lastHoverIndex >= 0) {
                    const isCrossRow = lastHoverRow !== fromRow;
                    let targetIndex = Math.min(lastHoverIndex, DEPTH_SLOTS - 1);

                    if (!isCrossRow) {
                        if (fromIndex < targetIndex) targetIndex--;
                    }

                    pill.remove();
                    if (isCrossRow) {
                        rebuildRow(fromRow);
                        pill.dataset.pos = lastHoverRow.dataset.pos;
                        pill.classList.add('cross-move');
                        setTimeout(() => pill.classList.remove('cross-move'), 500);
                    }

                    const allPills = Array.from(lastHoverRow.querySelectorAll('.pos-pill'));
                    const filled = allPills.filter(p => !p.classList.contains('empty-slot'));
                    const insertAt = Math.min(targetIndex, filled.length);
                    filled.splice(insertAt, 0, pill);

                    lastHoverRow.innerHTML = '';
                    filled.slice(0, DEPTH_SLOTS).forEach(p => lastHoverRow.appendChild(p));
                    for (let i = Math.min(filled.length, DEPTH_SLOTS); i < DEPTH_SLOTS; i++) {
                        lastHoverRow.appendChild(createEmptyPill(lastHoverRow.dataset.pos));
                    }

                    updateDepthLabels(lastHoverRow);
                    if (!isCrossRow) {
                        updateDepthLabels(lastHoverRow);
                    } else {
                        updateDepthLabels(fromRow);
                    }
                }

                dragState = null;
            }
        }

        async function init() {
            try {
                const resp = await fetch('data/teams/player_database.json');
                const db = await resp.json();
                const roster = db.teams[TEAM] || [];
                roster.forEach(p => {
                    if (p.pff) playerLookup[p.name] = p.pff;
                });
                console.log(`Loaded PFF data for ${Object.keys(playerLookup).length} players`);
            } catch (e) {
                console.warn('Could not load PFF data:', e);
            }

            buildTab(document.getElementById('tab-offense'), offenseData);
            buildTab(document.getElementById('tab-defense'), defenseData);
            buildTab(document.getElementById('tab-special'), specialData);
        }

        init();

        document.querySelectorAll('.panel-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
            });
        });

        const wrapper = document.querySelector('.page-wrapper');
        const container = document.getElementById('mainContainer');
        const chevLeft = document.getElementById('chevronLeft');
        const chevRight = document.getElementById('chevronRight');

        function setState(state) {
            wrapper.classList.remove('expand-left', 'expand-right');
            container.classList.remove('expand-left', 'expand-right');
            if (state) {
                wrapper.classList.add(state);
                container.classList.add(state);
            }
            chevLeft.classList.toggle('hidden', state === 'expand-right');
            chevRight.classList.toggle('hidden', state === 'expand-left');
        }

        chevLeft.addEventListener('click', () => {
            if (wrapper.classList.contains('expand-right')) return;
            if (wrapper.classList.contains('expand-left')) {
                setState(null);
            } else {
                setState('expand-right');
            }
        });

        chevRight.addEventListener('click', () => {
            if (wrapper.classList.contains('expand-left')) return;
            if (wrapper.classList.contains('expand-right')) {
                setState(null);
            } else {
                setState('expand-left');
            }
        });

        setState(null);
    </script>
</body>
</html>
