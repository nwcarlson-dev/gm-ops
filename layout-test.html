<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overflow: hidden;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 12px;
            padding: 12px;
        }

        .left-panel {
            width: 55%;
            height: 100%;
            overflow-y: auto;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            background: var(--card-bg);
        }

        .right-panel {
            width: 45%;
            height: 100%;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
        }

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--card-border);
            flex-shrink: 0;
        }

        .panel-tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .panel-tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent-red);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 6px;
            padding: 12px;
            flex: 1;
            min-height: 0;
        }

        .tab-content.active {
            display: flex;
        }

        .pos-row {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pos-label {
            width: 36px;
            flex-shrink: 0;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-align: center;
        }

        .pos-pill {
            flex: 1;
            height: 100%;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="app-header">
            <div style="display: flex; align-items: center; gap: 12px">
                <a href="index.html" class="logo-blocks">
                    <span class="gm">GM</span>
                    <span class="ops"><span class="o">O</span><span class="ps">PS</span></span>
                </a>
                <div class="mode-indicator offseason" style="background: rgba(212, 175, 55, 0.15); border: 1px solid rgba(212, 175, 55, 0.3);">
                    <span class="mode-dot" style="background: #D4AF37;"></span>
                    <span>Offseason Mode</span>
                </div>
            </div>
            <div class="header-nav">
                <a href="index.html">Home</a>
                <div class="user-menu">
                    <span class="user-avatar">G</span>
                    <span>Guest</span>
                </div>
            </div>
        </header>

        <div class="container">
            <div class="left-panel">
            </div>
            <div class="right-panel">
                <div class="panel-tabs">
                    <div class="panel-tab active" data-tab="offense">Offense</div>
                    <div class="panel-tab" data-tab="defense">Defense</div>
                    <div class="panel-tab" data-tab="special">Special Teams</div>
                    <div class="panel-tab" data-tab="tools">Tools</div>
                </div>

                <div class="tab-content active" id="tab-offense">
                    <div class="pos-row"><span class="pos-label">QB</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">RB</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">WR</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">WR</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">WR</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">TE</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">LT</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">LG</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">C</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">RG</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">RT</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                </div>

                <div class="tab-content" id="tab-defense">
                    <div class="pos-row"><span class="pos-label">DT</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">DT</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">EDGE</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">EDGE</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">LB</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">LB</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">CB</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">CB</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">NCB</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">SS</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">FS</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                </div>

                <div class="tab-content" id="tab-special">
                    <div class="pos-row"><span class="pos-label">K</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                    <div class="pos-row"><span class="pos-label">P</span><div class="pos-pill">1</div><div class="pos-pill">2</div></div>
                </div>

                <div class="tab-content" id="tab-tools">
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.panel-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
            });
        });
    </script>
</body>
</html>
