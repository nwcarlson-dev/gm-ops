<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/styles.css">
    <script src="/node_modules/sortablejs/Sortable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overflow: hidden;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .panel-controls {
            position: relative;
            height: 26px;
            flex-shrink: 0;
        }

        .chevron-group {
            position: absolute;
            top: 8px;
            left: calc(12px + (100% - 36px) * 0.55 + 6px);
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            transition: left 0.25s ease, transform 0.25s ease;
        }

        .panel-chevron {
            width: 22px;
            height: 18px;
            border: 1px solid var(--card-border);
            border-radius: 3px;
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: opacity 0.15s ease;
        }

        .panel-chevron:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
            background: rgba(255,255,255,0.06);
        }

        .panel-chevron.hidden {
            display: none;
        }

        .page-wrapper.expand-right .chevron-group {
            left: 12px;
            transform: translateX(0);
        }

        .page-wrapper.expand-left .chevron-group {
            left: calc(100% - 12px);
            transform: translateX(-100%);
        }

        .container {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 12px;
            padding: 6px 12px 12px 12px;
        }

        .left-panel {
            width: 55%;
            height: 100%;
            overflow-y: auto;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            background: var(--card-bg);
            transition: width 0.25s ease, padding 0.25s ease, border-color 0.25s ease, opacity 0.25s ease;
        }

        .right-panel {
            width: 45%;
            height: 100%;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            transition: width 0.25s ease, padding 0.25s ease, border-color 0.25s ease, opacity 0.25s ease;
        }

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--card-border);
            flex-shrink: 0;
        }

        .panel-tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .panel-tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent-red);
        }

        .tab-content {
            display: none;
            flex: 1;
            min-height: 0;
        }

        .tab-content.active {
            display: flex;
        }

        .labels-col {
            width: 44px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 40px 0 12px 0;
        }

        .pos-label {
            flex: 1;
            min-height: 0;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .pos-label.drop-ineligible {
            opacity: 0.3;
        }

        .pills-area {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            min-width: 0;
            padding: 0 12px 12px 0;
        }

        .pills-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            min-width: calc(300%);
        }

        .column-headers {
            display: flex;
            gap: 8px;
            padding: 14px 2px 6px;
            flex-shrink: 0;
        }

        .column-headers span {
            flex: 1;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            text-align: center;
        }

        .pill-row {
            flex: 1;
            min-height: 0;
            display: flex;
            gap: 8px;
            border-radius: 6px;
            padding: 2px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .pill-row.drop-ineligible {
            opacity: 0.3;
        }

        .pos-pill {
            flex: 1;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.15);
            cursor: grab;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
            padding: 4px 8px;
            overflow: hidden;
            min-width: 0;
        }

        .pos-pill:active {
            cursor: grabbing;
        }

        .pos-pill:hover {
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .pos-pill .pill-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            line-height: 1.3;
            color: #e2e8f0;
        }

        .pos-pill.empty-slot {
            border: 1px dashed rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.015);
            cursor: default;
            opacity: 1;
        }

        .pos-pill.empty-slot:hover {
            transform: none;
            box-shadow: none;
            border-color: rgba(255,255,255,0.08);
        }

        .pos-pill.sortable-ghost {
            opacity: 0.3;
            transform: scale(0.95);
        }

        .pos-pill.sortable-drag {
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-color: rgba(74, 222, 128, 0.5);
            z-index: 1000;
        }

        .pos-pill.sortable-chosen {
            border-color: rgba(255,255,255,0.3);
        }

        .pos-pill.starter {
            border-left: 2px solid var(--accent-red);
        }

        .pos-pill.cross-move {
            animation: crossMoveFlash 0.5s ease;
        }

        @keyframes crossMoveFlash {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
            50% { box-shadow: 0 0 12px 2px rgba(74, 222, 128, 0.3); }
            100% { box-shadow: none; }
        }

        .pills-area::-webkit-scrollbar {
            display: none;
        }
        .pills-area {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .container.expand-right .left-panel {
            width: 0;
            padding: 0;
            border-color: transparent;
            overflow: hidden;
        }

        .container.expand-right .right-panel {
            width: 100%;
        }

        .container.expand-right .pills-grid {
            min-width: 0;
            width: 100%;
        }

        .container.expand-right .pills-area {
            overflow-x: hidden;
        }

        .container.expand-left .right-panel {
            width: 0;
            border-color: transparent;
            overflow: hidden;
        }

        .container.expand-left .left-panel {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="app-header">
            <div style="display: flex; align-items: center; gap: 12px">
                <a href="index.html" class="logo-blocks">
                    <span class="gm">GM</span>
                    <span class="ops"><span class="o">O</span><span class="ps">PS</span></span>
                </a>
                <div class="mode-indicator offseason" style="background: rgba(212, 175, 55, 0.15); border: 1px solid rgba(212, 175, 55, 0.3);">
                    <span class="mode-dot" style="background: #D4AF37;"></span>
                    <span>Offseason Mode</span>
                </div>
            </div>
            <div class="header-nav">
                <a href="index.html">Home</a>
                <div class="user-menu">
                    <span class="user-avatar">G</span>
                    <span>Guest</span>
                </div>
            </div>
        </header>

        <div class="panel-controls">
            <div class="chevron-group">
                <div class="panel-chevron" id="chevronLeft" title="Expand roster panel">&#x276E;</div>
                <div class="panel-chevron" id="chevronRight" title="Expand main panel">&#x276F;</div>
            </div>
        </div>

        <div class="container" id="mainContainer">
            <div class="left-panel">
            </div>
            <div class="right-panel">
                <div class="panel-tabs">
                    <div class="panel-tab active" data-tab="offense">Offense</div>
                    <div class="panel-tab" data-tab="defense">Defense</div>
                    <div class="panel-tab" data-tab="special">Special Teams</div>
                    <div class="panel-tab" data-tab="tools">Tools</div>
                </div>

                <div class="tab-content active" id="tab-offense"></div>
                <div class="tab-content" id="tab-defense"></div>
                <div class="tab-content" id="tab-special"></div>
                <div class="tab-content" id="tab-tools"></div>
            </div>
        </div>
    </div>

    <script>
        const DEPTH_SLOTS = 6;

        const POSITION_COMPAT = {
            'QB':   [],
            'RB':   ['WR'],
            'WR':   ['RB'],
            'TE':   ['WR'],
            'LT':   ['RT', 'LG', 'RG'],
            'LG':   ['RG', 'C', 'LT', 'RT'],
            'C':    ['LG', 'RG'],
            'RG':   ['LG', 'C', 'LT', 'RT'],
            'RT':   ['LT', 'LG', 'RG'],
            'DT':   ['EDGE'],
            'EDGE': ['DT', 'LB'],
            'LB':   ['EDGE', 'SS'],
            'CB':   ['NCB', 'FS'],
            'NCB':  ['CB', 'SS'],
            'SS':   ['FS', 'LB', 'NCB'],
            'FS':   ['SS', 'CB', 'LB'],
            'K':    [],
            'P':    [],
        };

        const offenseData = [
            { pos: 'QB', players: ['Jacoby Brissett', 'Kedon Slovis'] },
            { pos: 'RB', players: ['Michael Carter', 'Emari Demercado'] },
            { pos: 'WR', players: ['Michael Wilson', 'Tejhaun Palmer'] },
            { pos: 'WR', players: ['Xavier Weaver', 'Bryson Green'] },
            { pos: 'WR', players: ['Jalen Brooks', 'Ihmir Smith-Marsette'] },
            { pos: 'TE', players: ['Trey McBride', 'Elijah Higgins'] },
            { pos: 'LT', players: ['Josh Fryar', 'Paris Johnson Jr.'] },
            { pos: 'LG', players: ['Evan Brown', 'Jon Gaines II'] },
            { pos: 'C',  players: ['Hjalte Froholdt', 'Jon Gaines II'] },
            { pos: 'RG', players: ['Isaiah Adams', 'Will Hernandez'] },
            { pos: 'RT', players: ['Kelvin Beachum', 'Christian Jones'] },
        ];

        const defenseData = [
            { pos: 'DT',   players: ['Calais Campbell', 'PJ Mustipher'] },
            { pos: 'DT',   players: ['Dalvin Tomlinson', 'L.J. Collier'] },
            { pos: 'EDGE', players: ['Josh Sweat', 'Jordan Burch'] },
            { pos: 'EDGE', players: ['Darius Robinson', 'Dante Stills'] },
            { pos: 'LB',   players: ['Akeem Davis-Gaither', 'Zaven Collins'] },
            { pos: 'LB',   players: ['Cody Simon', 'Owen Pappoe'] },
            { pos: 'CB',   players: ['Will Johnson', 'Elijah Jones'] },
            { pos: 'CB',   players: ['Denzel Burke', 'Max Melton'] },
            { pos: 'NCB',  players: ['Darren Hall', 'Jaden Davis'] },
            { pos: 'SS',   players: ['Jalen Thompson', 'Kitan Crawford'] },
            { pos: 'FS',   players: ['Budda Baker', 'Dadrion Taylor-Demerson'] },
        ];

        const specialData = [
            { pos: 'K', players: ['Chad Ryland'] },
            { pos: 'P', players: ['Blake Hayes'] },
        ];

        const depthLabels = ['1ST', '2ND', '3RD', '4TH', '5TH', '6TH'];

        function getCompatiblePositions(pos) {
            const compat = new Set(POSITION_COMPAT[pos] || []);
            compat.add(pos);
            return compat;
        }

        function buildTab(tabEl, data, groupName) {
            const labelsCol = document.createElement('div');
            labelsCol.className = 'labels-col';

            const pillsArea = document.createElement('div');
            pillsArea.className = 'pills-area';
            const pillsGrid = document.createElement('div');
            pillsGrid.className = 'pills-grid';

            const headerRow = document.createElement('div');
            headerRow.className = 'column-headers';
            for (let i = 0; i < DEPTH_SLOTS; i++) {
                const hdr = document.createElement('span');
                hdr.textContent = depthLabels[i];
                headerRow.appendChild(hdr);
            }
            pillsGrid.appendChild(headerRow);

            data.forEach((row, rowIndex) => {
                const label = document.createElement('div');
                label.className = 'pos-label';
                label.textContent = row.pos;
                label.dataset.pos = row.pos;
                label.dataset.rowIndex = rowIndex;
                labelsCol.appendChild(label);

                const pillRow = document.createElement('div');
                pillRow.className = 'pill-row';
                pillRow.dataset.pos = row.pos;
                pillRow.dataset.rowIndex = rowIndex;

                for (let i = 0; i < DEPTH_SLOTS; i++) {
                    const pill = document.createElement('div');
                    pill.className = 'pos-pill';
                    pill.dataset.pos = row.pos;

                    if (row.players[i]) {
                        pill.dataset.player = row.players[i];
                        if (i === 0) pill.classList.add('starter');

                        const nameEl = document.createElement('span');
                        nameEl.className = 'pill-name';
                        nameEl.textContent = row.players[i];
                        pill.appendChild(nameEl);
                    } else {
                        pill.classList.add('empty-slot');
                    }

                    pillRow.appendChild(pill);
                }

                pillsGrid.appendChild(pillRow);
            });

            pillsArea.appendChild(pillsGrid);
            tabEl.appendChild(labelsCol);
            tabEl.appendChild(pillsArea);

            initSortable(tabEl, data, groupName);
        }

        function updateDepthLabels(row) {
            const pills = row.querySelectorAll('.pos-pill');
            pills.forEach((pill, i) => {
                pill.classList.toggle('starter', i === 0 && !pill.classList.contains('empty-slot'));
            });
        }

        function normalizeRow(row) {
            const pills = Array.from(row.querySelectorAll('.pos-pill'));
            const filled = pills.filter(p => !p.classList.contains('empty-slot'));
            const empties = pills.filter(p => p.classList.contains('empty-slot'));

            while (filled.length + empties.length < DEPTH_SLOTS) {
                const empty = createEmptyPill(row.dataset.pos);
                empties.push(empty);
            }

            while (filled.length + empties.length > DEPTH_SLOTS) {
                if (empties.length > 0) {
                    const last = empties.pop();
                    if (last.parentNode) last.parentNode.removeChild(last);
                }
            }

            row.innerHTML = '';
            filled.forEach(p => row.appendChild(p));
            const neededEmpties = DEPTH_SLOTS - filled.length;
            for (let i = 0; i < neededEmpties; i++) {
                if (empties[i]) {
                    row.appendChild(empties[i]);
                } else {
                    row.appendChild(createEmptyPill(row.dataset.pos));
                }
            }
        }

        function createEmptyPill(pos) {
            const pill = document.createElement('div');
            pill.className = 'pos-pill empty-slot';
            pill.dataset.pos = pos;
            return pill;
        }

        let currentDragPos = null;

        function initSortable(tabEl, data, groupName) {
            const rows = tabEl.querySelectorAll('.pill-row');
            const labels = tabEl.querySelectorAll('.pos-label');

            rows.forEach((row) => {
                Sortable.create(row, {
                    group: {
                        name: groupName,
                        pull: true,
                        put: function(to) {
                            const toPos = to.el.dataset.pos;
                            const fromPos = currentDragPos;
                            if (!fromPos) return true;
                            const compat = getCompatiblePositions(fromPos);
                            return compat.has(toPos);
                        }
                    },
                    animation: 200,
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    chosenClass: 'sortable-chosen',
                    swapThreshold: 0.5,
                    fallbackOnBody: true,
                    filter: '.empty-slot',
                    onStart: function(evt) {
                        const draggedPill = evt.item;
                        currentDragPos = draggedPill.dataset.pos;
                        const compat = getCompatiblePositions(currentDragPos);

                        rows.forEach((r, i) => {
                            const rPos = r.dataset.pos;
                            if (!compat.has(rPos)) {
                                r.classList.add('drop-ineligible');
                                labels[i].classList.add('drop-ineligible');
                            }
                        });
                    },
                    onEnd: function(evt) {
                        currentDragPos = null;

                        rows.forEach((r, i) => {
                            r.classList.remove('drop-ineligible');
                            labels[i].classList.remove('drop-ineligible');
                        });

                        const fromRow = evt.from;
                        const toRow = evt.to;

                        if (fromRow !== toRow) {
                            evt.item.dataset.pos = toRow.dataset.pos;
                            evt.item.classList.add('cross-move');
                            setTimeout(() => evt.item.classList.remove('cross-move'), 500);
                        }

                        normalizeRow(fromRow);
                        normalizeRow(toRow);
                        updateDepthLabels(fromRow);
                        updateDepthLabels(toRow);
                    }
                });
            });
        }

        buildTab(document.getElementById('tab-offense'), offenseData, 'depth-offense');
        buildTab(document.getElementById('tab-defense'), defenseData, 'depth-defense');
        buildTab(document.getElementById('tab-special'), specialData, 'depth-special');

        document.querySelectorAll('.panel-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
            });
        });

        const wrapper = document.querySelector('.page-wrapper');
        const container = document.getElementById('mainContainer');
        const chevLeft = document.getElementById('chevronLeft');
        const chevRight = document.getElementById('chevronRight');

        function setState(state) {
            wrapper.classList.remove('expand-left', 'expand-right');
            container.classList.remove('expand-left', 'expand-right');
            if (state) {
                wrapper.classList.add(state);
                container.classList.add(state);
            }
            chevLeft.classList.toggle('hidden', state === 'expand-right');
            chevRight.classList.toggle('hidden', state === 'expand-left');
        }

        chevLeft.addEventListener('click', () => {
            if (wrapper.classList.contains('expand-right')) return;
            if (wrapper.classList.contains('expand-left')) {
                setState(null);
            } else {
                setState('expand-right');
            }
        });

        chevRight.addEventListener('click', () => {
            if (wrapper.classList.contains('expand-left')) return;
            if (wrapper.classList.contains('expand-right')) {
                setState(null);
            } else {
                setState('expand-left');
            }
        });

        setState(null);
    </script>
</body>
</html>
