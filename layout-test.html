<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overflow: hidden;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 12px;
            padding: 12px;
        }

        .left-panel {
            width: 58%;
            height: 100%;
            overflow-y: auto;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            background: var(--card-bg);
        }

        .right-panel {
            width: 42%;
            height: 100%;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow-y: auto;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
        }

        .right-panel-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            flex: 1;
            min-height: 0;
        }

        .pill {
            flex: 1;
            min-height: 0;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            background: rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="app-header">
            <div style="display: flex; align-items: center; gap: 12px">
                <a href="index.html" class="logo-blocks">
                    <span class="gm">GM</span>
                    <span class="ops"><span class="o">O</span><span class="ps">PS</span></span>
                </a>
                <div class="mode-indicator offseason" style="background: rgba(212, 175, 55, 0.15); border: 1px solid rgba(212, 175, 55, 0.3);">
                    <span class="mode-dot" style="background: #D4AF37;"></span>
                    <span>Offseason Mode</span>
                </div>
            </div>
            <div class="header-nav">
                <a href="index.html">Home</a>
                <div class="user-menu">
                    <span class="user-avatar">G</span>
                    <span>Guest</span>
                </div>
            </div>
        </header>

        <div class="container">
            <div class="left-panel">
            </div>
            <div class="right-panel">
                <div class="right-panel-content">
                    <div class="pill">1</div>
                    <div class="pill">2</div>
                    <div class="pill">3</div>
                    <div class="pill">4</div>
                    <div class="pill">5</div>
                    <div class="pill">6</div>
                    <div class="pill">7</div>
                    <div class="pill">8</div>
                    <div class="pill">9</div>
                    <div class="pill">10</div>
                    <div class="pill">11</div>
                    <div class="pill">12</div>
                    <div class="pill">13</div>
                    <div class="pill">14</div>
                    <div class="pill">15</div>
                    <div class="pill">16</div>
                    <div class="pill">17</div>
                    <div class="pill">18</div>
                    <div class="pill">19</div>
                    <div class="pill">20</div>
                    <div class="pill">21</div>
                    <div class="pill">22</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
